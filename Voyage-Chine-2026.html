{id:'b03',date:'2026-12-05',time:'20:15',end:'21:20',name:'Dîner près de Jianguomen',tag:'Facultatif',type:'shopping',cost:100,duration:'45 à 75 min',priority:'optional',cn:'建国门外大街 / 永安里',photo:im.beijing,desc:'Dîner près de l’hôtel, petite balade dans le quartier si vous avez encore de l’énergie.',details:['Prendre un dîner simple à proximité de l’hôtel plutôt que traverser la ville.','Si vous voulez sortir davantage : le Silk Market (秀水街) est dans le secteur de Yong’anli, mais vérifiez les horaires avant de vous y rendre; Wangfujing est déjà prévu le lendemain.','Pour trouver un repas halal : rechercher 清真 (qīngzhēn) sur AMap ou Dianping; confirmer ingrédients et préparation sur place.'],route:'Privilégier un restaurant dans le secteur Jianguomen / Yong’anli, accessible à pied. Pas besoin de traverser Pékin le premier soir. Utiliser AMap ou Dianping pour chercher 清真 (halal).',app:'AMap · Dianping · Alipay',tip:'Plan B : douche, repos, dîner près de l’hôtel et coucher tôt.',url:'https://www.amap.com/search?query=王府井',reserve:'Aucune réservation',budget:'~60–150 CNY/personne selon le restaurant.'},
{id:'b04',date:'2026-12-06',time:'07:45',end:'08:25',name:'Hôtel → Place Tian’anmen',tag:'Départ anticipé',type:'transport',cost:25,duration:'25 à 45 min',priority:'must',cn:'天安门广场',photo:im.forbidden,desc:'Accès à la zone sécurisée avant la visite du centre impérial.',details:['Prendre le petit-déjeuner tôt et partir avec les passeports originaux.','Depuis le secteur Jianguomen / Yong’anli : métro ligne 1 depuis Yong’anli (永安里) en direction de Tian’anmen East (天安门东), puis rejoindre l’accès autorisé; ou DiDi + marche jusqu’au contrôle.','Les contrôles peuvent imposer des détours : suivre les consignes locales et l’accès associé au créneau réservé.'],route:'Quartier Jianguomen / Yong’anli → station Yong’anli (永安里) → métro ligne 1 direction ouest → Tian’anmen East (天安门东), puis accès autorisé. Vérifier accès, contrôles et réservations.',app:'AMap · Alipay Metro QR',tip:'Les temps sont des marges, pas une promesse d’accès immédiat.',url:'https://english.beijing.gov.cn/travellinginbeijing/attractions/202603/t20260325_4566110.html',reserve:'Accès Tian’anmen',budget:'Métro ~3 CNY/personne ou DiDi selon hôtel.'},
{id:'b05',date:'2026-12-06',time:'08:25',end:'09:15',name:'Place Tian’anmen',tag:'Réservation / sécurité',type:'culture',cost:0,duration:'45 à 60 min',priority:'must',cn:'天安门广场',photo:im.forbidden,desc:'Le cœur monumental de Pékin, avec vue sur la Porte Tian’anmen et les grands bâtiments officiels.',details:['Observer la porte Tian’anmen, l’axe historique nord-sud, le Monument aux Héros du Peuple et le Mausolée de Mao vu de l’extérieur.','Ne pas compter sur une simple entrée spontanée : consulter les règles de réservation dans le mini-programme WeChat « 天安门广场预约参观 ».','L’accès est gratuit mais nominatif; les visiteurs étrangers peuvent devoir renseigner leur numéro de passeport.'],route:'Depuis la place, rejoindre à pied l’axe nord vers l’entrée sud de la Cité interdite. Prévoir 15 à 25 min de marche et contrôle.',app:'WeChat (mini-programme) · AMap',tip:'Le système web peut refuser les numéros étrangers : prévoir le mini-programme WeChat ou une réservation autorisée via un autre site compatible.',url:'https://english.beijing.gov.cn/12345hotline/faqs/all/202506/t20250619_4117006.html',reserve:'Réservation gratuite à effectuer',budget:'Gratuit'},
{id:'b06',date:'2026-12-06',time:'09:30',end:'13:30',name:'Cité interdite · Palais impérial',tag:'À réserver en priorité',type:'culture',cost:50,duration:'3 h 30 à 4 h',priority:'must',cn:'故宫博物院 / 午门',photo:im.forbidden,desc:'La visite centrale de Pékin : palais, cours impériales, halls cérémoniels et jardins Ming/Qing.',details:['Entrée par la Porte du Midi (午门, Meridian Gate) au sud, visite obligatoirement du sud au nord.','Parcours essentiel : Porte de l’Harmonie suprême → Salle de l’Harmonie suprême → Salle de l’Harmonie centrale → Salle de l’Harmonie préservée → palais intérieurs → Jardin impérial.','Option intéressante : Galerie des Trésors (+10 CNY) si ouverte et si vous voulez ajouter du temps; la Galerie des Horloges est aussi séparément payante.','Sortie par la Porte de la Prouesse divine (神武门) au nord, idéalement pour rejoindre Jingshan.'],route:'Depuis Tian’anmen, avancer vers le nord par l’axe du palais, contrôle puis porte du Midi. Sortie au nord; ne pas prévoir d’aller-retour par l’entrée.',app:'Site officiel Palace Museum · AMap',tip:'Fermé le lundi. En décembre : 08h30–16h30, dernière entrée 15h30. Billet adulte 40 CNY (+10 CNY Galerie des Trésors, option). Billetterie 7 jours avant à 20h heure de Pékin, soit le 29 novembre vers 13h à Paris pour le 6 décembre.',url:'https://intl.dpm.org.cn/visit',reserve:'29 novembre · vérifier l’ouverture des ventes',budget:'40 CNY + éventuels suppléments.'},
{id:'b07',date:'2026-12-06',time:'13:30',end:'14:20',name:'Pause déjeuner & trajet vers Jingshan',tag:'Pause essentielle',type:'food',cost:80,duration:'45 à 60 min',priority:'must',cn:'景山公园 南门',photo:im.forbidden,desc:'Petite pause après la marche dans l’immense palais et passage vers le parc Jingshan.',details:['Les possibilités de restauration à proximité de la sortie nord peuvent être limitées ou bondées : garder un snack et de l’eau.','Si vous souhaitez un vrai restaurant, prévoir une pause un peu plus longue et rogner sur le shopping du soir.'],route:'Sortie nord de la Cité interdite → traversée encadrée de la rue Jing Shan Qian → porte sud de Jingshan, environ 10–15 minutes à pied hors attente.',app:'AMap · Alipay',tip:'Le déjeuner se fera idéalement dans un endroit que vous aurez repéré la veille; chercher 清真 pour une option halal.',url:'https://www.amap.com/search?query=景山公园',reserve:'Libre',budget:'~50–100 CNY/personne'},
{id:'b08',date:'2026-12-06',time:'14:20',end:'15:25',name:'Parc Jingshan · vue sur le palais',tag:'Point photo',type:'nature',cost:2,duration:'50 à 70 min',priority:'must',cn:'景山公园 / 万春亭',photo:im.forbidden,desc:'Une montée courte jusqu’au pavillon Wanchun révèle toute la symétrie des toits dorés de la Cité interdite.',details:['Entrer par le sud puis monter vers le Pavillon Wanchun. Compter 10 à 20 minutes d’escaliers selon le rythme.','Profiter du panorama à 360°, repérer la Cité interdite au sud et les axes historiques de Pékin.','Possible arrêt café ou pause photo si météo claire.'],route:'Depuis la sortie nord de la Cité interdite : à pied vers l’entrée sud du parc. Retour de Jingshan → Wangfujing en DiDi (~15–30 min selon trafic) ou à pied si motivés.',app:'AMap',tip:'À faire avant la fin de l’après-midi car la lumière baisse vite début décembre. Deux pages officielles de Pékin divergent sur l’achat sur place pour étrangers : l’une l’autorise, une autre demande un appel de réservation au +86 10 6605 5431. Vérifier avant départ.',url:'https://www.amap.com/search?query=景山公园',reserve:'Billet sur place en principe',budget:'~2 CNY/personne estimatif'},
{id:'b09',date:'2026-12-06',time:'16:15',end:'19:30',name:'Wangfujing · shopping & dîner',tag:'À doser',type:'shopping',cost:150,duration:'2 à 3 h',priority:'optional',cn:'王府井大街 / 北京apm / 王府中環',photo:im.beijing,desc:'Temps libre dans le centre commerçant de Pékin, entre enseignes classiques et centres commerciaux.',details:['Découvrir Beijing apm, WF Central et les enseignes de Wangfujing.','Faire une liste d’envies : vêtements, cosmétique, marques chinoises, souvenirs; l’offre varie selon les magasins.','Pour un dîner typiquement pékinois : Ziguangyuan (紫光园 王府井店), 王府井大街99号, ou Dong Lai Shun (东来顺饭庄, succursale Beijing APM), 5e étage, salles 542–547, Beijing APM, 138 Wangfujing Dajie : fondue traditionnelle halal d’agneau. Adresse vérifiée par le gouvernement municipal de Pékin.','Vérifier l’heure de fermeture de la succursale du jour et la réservation éventuelle; en cas d’attente, chercher 清真 dans AMap.'],route:'Jingshan → Wangfujing : DiDi conseillé 15–30 min selon circulation ou marche 25–40 min.',app:'AMap · Dianping · Alipay',tip:'Garder cette séquence flexible si les visites historiques prennent davantage de temps.',url:'https://www.amap.com/search?query=王府井',reserve:'Libre',budget:'Achats à part; repas ~60–150 CNY/personne.'},
{id:'b10',date:'2026-12-07',time:'07:30',end:'09:50',name:'Départ pour la Muraille · Mutianyu',tag:'Chauffeur recommandé',type:'transport',cost:450,duration:'1 h 30 à 2 h 30',priority:'must',cn:'慕田峪长城景区',photo:im.wall,desc:'Quitter la ville tôt pour atteindre Mutianyu avant la foule et profiter d’un maximum de lumière.',details:['Option recommandée : chauffeur privé avec aller-retour et attente sur place, prix à demander pour les deux passagers, parking/attente inclus.','Alternative économique : transport touristique direct réservé sur plateforme; horaires plus rigides mais moins cher.','Option transports publics (plus lente) : bus 916 Express depuis Dongzhimen → Huairoubeidajie → correspondance locale H23/H3/H71 vers Mutianyu, selon horaires du jour.'],route:'Secteur Jianguomen / Yong’anli → Mutianyu Scenic Area Visitor Center, district de Huairou (environ 70–80 km). Estimation voiture : 1 h 30–2 h 30. Vérifier la prise en charge dans le bon terminal et la zone précise.',app:'DiDi / prestataire privé · AMap · Trip.com',tip:'Éviter de commander un aller simple sans solution garantie pour revenir de la montagne. Chauffeur A/R ou bus officiel plus fiable.',url:'https://english.beijing.gov.cn/travellinginbeijing/attractions/202603/t20260325_4566115.html',reserve:'Transport à choisir',budget:'Chauffeur A/R ~450–800 CNY par véhicule comme enveloppe indicative, à deviser.'},
{id:'b11',date:'2026-12-07',time:'09:50',end:'10:30',name:'Billets, navette & montée à Mutianyu',tag:'Deux réseaux de remontées',type:'transport',cost:200,duration:'30 à 50 min',priority:'must',cn:'慕田峪长城 / 缆车',photo:im.wall,desc:'Entrer dans le site, rejoindre le point de départ des remontées et monter au niveau des remparts.',details:['Sur place : contrôle/achat de l’entrée, navette interne si nécessaire, puis trajet vers l’opérateur de remontée sélectionné.','La télécabine fermée (cable car) arrive près de la tour 14. Le télésiège arrive vers la tour 6. Ce ne sont pas exactement les mêmes installations ni billets.','Option confort : télécabine aller-retour depuis la tour 14. Option aventure : télécabine montée + marche vers tour 6 + luge descente si ouverte.'],route:'Visitor Center → navette locale → station de télécabine. Suivre les panneaux « Cable Car » (pour tour 14) ou « Chairlift / Toboggan » (zone tour 6).',app:'Site officiel Mutianyu · Alipay',tip:'Le site touristique indique 45 CNY d’entrée adulte; remontées/navettes facturées en plus. Vérifier tarifs saisonniers et activité des remontées le jour J.',url:'https://en.mutianyugreatwall.com/',reserve:'Billets / remontées à confirmer',budget:'Entrée 45 CNY + navette ~15 CNY + remontée ~140–200 CNY (enveloppes).'},
{id:'b12',date:'2026-12-07',time:'10:30',end:'13:20',name:'Marcher SUR la Grande Muraille',tag:'Expérience phare',type:'nature',cost:0,duration:'2 h 30 à 3 h',priority:'must',cn:'慕田峪长城 14号敌楼',photo:im.wall,desc:'Marche sur les remparts en pierre entre tours de guet. Pas d’escalade verticale : des allées, marches et escaliers sur les crêtes.',details:['Option confort (préférée par défaut) : tour 14 → tours 15 à 18 selon énergie → retour tour 14 → télécabine fermée.','Option aventure : tour 14 → marche en direction de la tour 6 (plus longue et avec escaliers raides) → descente en luge si ouverte.','S’arrêter fréquemment pour les paysages et les photos; les marches sont irrégulières et certaines pentes sont très fortes.','Ne pas poursuivre trop loin si verglas, vent violent ou fatigue. Avoir de l’eau, une couche chaude et des chaussures antidérapantes.'],route:'Circuit piéton sur les remparts selon l’option choisie. Descente par l’opérateur correspondant à la sortie retenue. Ne pas compter sur un accès instantané d’une station à l’autre.',app:'AMap · appareil photo · Site Mutianyu',tip:'La luge dépend de la météo et des opérations du jour. En cas de gel, rester sur le parcours confort avec télécabine A/R.',url:'https://en.mutianyugreatwall.com/',reserve:'Choisir le parcours dans l’app',budget:'Marche incluse dans l’entrée du site.'},
{id:'b13',date:'2026-12-07',time:'13:20',end:'14:15',name:'Descente, pause & déjeuner',tag:'Prévoir chaud',type:'food',cost:85,duration:'45 à 60 min',priority:'must',cn:'慕田峪长城 游客中心',photo:im.wall,desc:'Fin de la visite, descente et déjeuner simple avant de repartir.',details:['Si parcours confort : retour à la tour 14 et télécabine A/R.','Si parcours aventure : descente en luge uniquement si opérationnelle, puis retour vers la zone visiteurs.','Possibilités de restauration touristique en bas : offre et options halal à vérifier; apporter une collation comme solution de secours.'],route:'Tour choisie → remontée/descente → navette vers Visitor Center → rendez-vous au point exact convenu avec le chauffeur.',app:'AMap · messagerie du chauffeur',tip:'Ne pas supposer que la luge fonctionne en décembre; organiser le retour sans en dépendre.',url:'https://en.mutianyugreatwall.com/',reserve:'Aucune, hors remontées',budget:'~50–120 CNY/personne de repas.'},
{id:'b14',date:'2026-12-07',time:'14:15',end:'16:45',name:'Retour vers Pékin & récupération',tag:'Marge trafic',type:'transport',cost:0,duration:'2 à 2 h 30',priority:'must',cn:'建国门 / 永安里',photo:im.beijing,desc:'Retour à l’hôtel, douche et repos après la marche et le froid.',details:['Confirmer l’heure et le lieu de rendez-vous avec le chauffeur avant de monter sur la Muraille.','Si retour tardif, raccourcir Sanlitun, sans chercher à récupérer le retard.'],route:'Mutianyu → Jianguomen / Yong’anli en véhicule privé ou bus réservé. Le montant est normalement compris dans le trajet A/R déjà budgété.',app:'DiDi · AMap',tip:'Ne pas prévoir de rendez-vous non remboursable à 17h : circulation incertaine.',url:'https://www.amap.com/',reserve:'Inclus dans la voiture A/R',budget:'Inclus dans transport aller-retour.'},
{id:'b15',date:'2026-12-07',time:'18:00',end:'19:15',name:'Taikoo Li Sanlitun · shopping',tag:'Moderne & animé',type:'shopping',cost:130,duration:'2 à 3 h',priority:'optional',cn:'三里屯太古里',photo:im.sanlitun,desc:'Pékin moderne : enseignes tendance, façades contemporaines, concepts stores et restaurants.',details:['Regarder l’architecture colorée du complexe Taikoo Li.','Explorer boutiques de sneakers, mode, design et enseignes internationales selon vos envies.','Pour dîner halal à Sanlitun : Khan Baba (汗巴巴巴基斯坦餐厅), restaurant pakistanais dans Sanlitun SOHO, bâtiment 2, 5e étage, unité 511; vérifier le fonctionnement de cette adresse avant de s’y rendre.','Autre piste dans le secteur des ambassades : Alameen (阿米恩阿拉伯餐厅), 2 Sanlitun West 5th Street, cuisine moyen-orientale. Confirmer l’ouverture et les ingrédients.'],route:'Wangfujing → Sanlitun : DiDi environ 20–40 min selon le trafic; métro possible mais demande une marche de correspondance. Retour DiDi le soir.',app:'AMap · DiDi · Alipay',tip:'Alternative si fatigués : rester à Wangfujing. Ne pas imposer un shopping de trois heures après le vent de Mutianyu.',url:'https://www.amap.com/search?query=三里屯太古里',reserve:'Aucune',budget:'~80–180 CNY/personne hors achats.'},
{id:'b16',date:'2026-12-08',time:'08:00',end:'09:00',name:'Hôtel → Palais d’Été',tag:'Trajet vers Haidian',type:'transport',cost:65,duration:'45 à 75 min',priority:'must',cn:'颐和园 东宫门',photo:im.summer,desc:'Départ vers le nord-ouest de Pékin, où se situe le grand jardin impérial.',details:['Option simple : DiDi vers East Palace Gate (东宫门), utile si vous voulez suivre un parcours d’est en ouest.','Option métro : ligne 4 jusqu’à Xiyuan (西苑), puis marche vers East Palace Gate; choisir l’itinéraire exact depuis l’hôtel dans AMap.'],route:'Jianguomen / Yong’anli → East Palace Gate, Summer Palace. DiDi ~45–75 min selon trafic ou métro avec correspondance.',app:'DiDi · AMap',tip:'Prévoir la porte d’entrée dans l’itinéraire : le site est immense et ses portes sont éloignées.',url:'https://english.beijing.gov.cn/specials/parktours/guidevisitors/summerpalace/',reserve:'Entrée du Palais d’Été',budget:'Taxi ~50–100 CNY (estimation par véhicule) ou métro.'},
{id:'b17',date:'2026-12-08',time:'09:00',end:'12:30',name:'Palais d’Été · lac et pavillons',tag:'Grand parc impérial',type:'culture',cost:50,duration:'3 h à 3 h 30',priority:'must',cn:'颐和园 / 长廊 / 佛香阁',photo:im.summer,desc:'Lac Kunming, Longue Galerie peinte, colline de la Longévité et bâtiments impériaux.',details:['Entrer par East Palace Gate, voir Hall of Benevolence and Longevity puis rejoindre la Longue Galerie aux plafonds peints.','Longer une partie du lac Kunming; si météo agréable, gravir une portion de Longevity Hill jusqu’à un point de vue.','La Tour de l’Encens bouddhique est comprise dans le billet combiné lorsqu’elle est ouverte.','En décembre, les bateaux ne doivent pas être considérés comme une activité garantie; possible gel du lac.'],route:'Dans le parc à pied. Pour sortir vers Beigongmen et gagner le métro ligne 4, prévoir le sens de la visite et du temps de marche.',app:'AMap · Alipay',tip:'Billet simple 20 CNY ou combiné 50 CNY en basse saison. L’administration de Pékin signale la possibilité d’achat assisté au guichet avec passeport si inscription en ligne impossible sur téléphone étranger.',url:'https://english.beijing.gov.cn/specials/parktours/guidevisitors/summerpalace/',reserve:'Billet à acheter / confirmer',budget:'50 CNY/personne si combiné.'},
{id:'b18',date:'2026-12-08',time:'12:30',end:'14:15',name:'Déjeuner & transfert au Temple des Lamas',tag:'Grand déplacement',type:'transport',cost:105,duration:'1 h 30 à 1 h 45',priority:'must',cn:'雍和宫',photo:im.temple,desc:'Pause déjeuner puis traversée vers le quartier de Yonghegong.',details:['Déjeuner rapidement près de la sortie du Palais d’Été ou emporter une collation.','Pour gagner du temps, privilégier le métro ligne 4 puis correspondances selon AMap; DiDi peut être plus direct mais trafic imprévisible.','Fixer une arrivée au Temple des Lamas avant 15h, sous peine de perdre la visite.'],route:'Palais d’Été (Beigongmen ou Xiyuan) → métro ligne 4 → correspondance vers ligne 2/5 ou trajet DiDi → Yonghegong. Selon sortie exacte, 50–80 min hors repas.',app:'AMap · Alipay Metro QR',tip:'Si retard au Palais d’Été : supprimer le Temple des Lamas et garder les hutongs. C’est le plan B logique.',url:'https://www.amap.com/search?query=雍和宫',reserve:'Aucune réservation trajet',budget:'Transport + déjeuner, ~80–150 CNY/personne.'},
{id:'b19',date:'2026-12-08',time:'14:15',end:'15:25',name:'Temple des Lamas · Yonghegong',tag:'Culture bouddhiste',type:'culture',cost:25,duration:'1 h à 1 h 15',priority:'optional',cn:'雍和宫',photo:im.temple,desc:'Enfilade de pavillons et grand Bouddha en bois, dans un ancien palais devenu temple tibétain.',details:['Explorer les pavillons d’entrée à sortie, en respectant les espaces de culte.','Observer les toitures jaune/or et l’encens; la photographie peut être interdite dans certains pavillons.','La visite est raccourcissable si vous souhaitez profiter davantage des quartiers locaux.'],route:'Station de métro Yonghegong Lama Temple (lignes 2/5), puis marche à pied. Ensuite DiDi ou balade vers Nanluoguxiang.',app:'AMap · Alipay',tip:'En hiver, l’entrée ferme relativement tôt (vérifier le dernier accès avant la journée). Tarif indicatif ~25 CNY/personne.',url:'https://www.amap.com/search?query=雍和宫',reserve:'Billet sur place/à vérifier',budget:'~25 CNY/personne estimatif.'},
{id:'b20',date:'2026-12-08',time:'15:45',end:'17:00',name:'Nanluoguxiang · ruelles traditionnelles',tag:'Vie de quartier',type:'culture',cost:0,duration:'1 h à 1 h 15',priority:'must',cn:'南锣鼓巷',photo:im.beijing,desc:'Une ruelle de hutongs avec boutiques, snacks, maisons basses et art de vivre local.',details:['Commencer par la rue principale pour l’ambiance, puis entrer dans quelques ruelles transversales plus calmes.','Chercher des objets artisanaux et souvenirs plutôt que de consacrer tout le temps aux grandes chaînes.','Les lanternes et enseignes prennent une ambiance différente après le coucher du soleil.'],route:'Yonghegong → Nanluoguxiang : environ 20–30 min en voiture selon trafic, ou métro / marche selon votre énergie. Puis rejoindre Houhai à pied si météo correcte.',app:'AMap · Dianping',tip:'Attention aux boutiques très touristiques : comparer les prix et ne pas confondre attraction et véritable quartier résidentiel.',url:'https://www.amap.com/search?query=南锣鼓巷',reserve:'Libre',budget:'Entrée gratuite, achats à part.'},
{id:'b21',date:'2026-12-08',time:'17:00',end:'18:10',name:'Lac Houhai / Shichahai · balade',tag:'Soirée locale',type:'food',cost:115,duration:'1 h 30 à 2 h',priority:'optional',cn:'后海 / 什刹海',photo:im.beijing,desc:'Promenade autour des lacs et des hutongs. La fondue halal Man Heng Ji est prévue ensuite, de l’autre côté du vieux centre.',details:['Marcher le long du lac Houhai, photographier les ponts et petites rues adjacentes.','Découvrir la zone des hutongs autour de Shichahai.','En décembre, de la glace est possible mais les activités de patinage ne sont pas garanties à ces dates.','Idée concrète de dîner : Nan Men Hot Pot / Nanmen Shuanrou (南门涮肉), succursale près de Houhai et du pont Yinding; fondue traditionnelle halal à l’agneau. Vérifier adresse, horaires et disponibilité dans AMap.','Alternative : chercher 清真 dans Dianping ou AMap et vérifier la certification/les ingrédients avant de commander.'],route:'Nanluoguxiang → Houhai : marche environ 20–30 min (selon point visé) ou petit DiDi. Retour à l’hôtel en DiDi.',app:'AMap · Dianping · DiDi',tip:'En hiver, la balade peut être écourtée pour arriver à l’heure au dîner de Ping’anli.',url:'https://www.amap.com/search?query=后海',reserve:'Libre',budget:'~70–160 CNY/personne hors achats.'},

function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function safeURL(u){return /^https:\/\//i.test(String(u||''))?esc(u):'#'}

function locationSearch(name,cn,address,city){return [String(cn||name||'').trim(),String(address||'').trim(),String(city||'').trim()].filter(Boolean).join(', ')}
function locationActions(name,cn,address='',city='',options={}){const title=String(name||cn||'').trim(),chinese=String(cn||'').trim();if(!title&&!chinese)return '';const query=locationSearch(title,chinese,address,city),encoded=encodeURIComponent(query),google='https://www.google.com/maps/search/?api=1&query='+encoded,apple='https://maps.apple.com/?q='+encoded;const compact=options.compact?' compact':'';const copyLabel=/[\u3400-\u9fff]/.test(chinese)?'Copier le nom chinois':'Copier le nom';return `<div class="location-actions${compact}" aria-label="Ouvrir l’adresse dans une carte">${options.amap===false?'':`<a class="location-link" target="_blank" rel="noopener noreferrer" href="https://www.amap.com/search?query=${encodeURIComponent(chinese||title)}">AMap ↗</a>`}<a class="location-link" target="_blank" rel="noopener noreferrer" href="${esc(google)}">Google Maps ↗</a><a class="location-link" target="_blank" rel="noopener noreferrer" href="${esc(apple)}">Apple Plans ↗</a>${chinese?`<button class="location-copy" type="button" data-copy="${esc(chinese)}" aria-label="Copier le nom chinois de ${esc(title)}">${esc(copyLabel)}</button>`:''}</div>`}

function curActivities(){return [...acts,...data.custom].map(a=>data.slotOverrides?.[a.id]?{...a,...data.slotOverrides[a.id]}:a).sort((a,b)=>a.date.localeCompare(b.date)||a.time.localeCompare(b.time))}
function allDayActivities(date){return curActivities().filter(a=>a.date===date)}
function activeDayActivities(date){return allDayActivities(date).filter(a=>!data.hiddenActivities?.[a.id])}
function canSwapActivity(a){return a&&!['transport','flight'].includes(a.type)&&!data.reservations?.[a.id]}
function swapWithNext(id){const a=curActivities().find(x=>x.id===id);if(!canSwapActivity(a))return;const list=activeDayActivities(a.date);const index=list.findIndex(x=>x.id===id);const next=list.slice(index+1).find(x=>canSwapActivity(x));if(!next){showToast('Aucune étape suivante échangeable.');return}data.slotOverrides=data.slotOverrides||{};data.slotOverrides[a.id]={time:next.time,end:next.end};data.slotOverrides[next.id]={time:a.time,end:a.end};save();const y=window.scrollY;render();window.scrollTo({top:y,behavior:'instant'});showToast('Créneaux échangés. Vérifier les horaires réels.')}

function daysToDate(s){const now=new Date();const today=Date.UTC(now.getFullYear(),now.getMonth(),now.getDate());const [y,m,d]=s.split('-').map(Number);return Math.round((Date.UTC(y,m-1,d)-today)/86400000)}

function chinaDate(){const p=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const a=Object.fromEntries(p.filter(x=>x.type!=='literal').map(x=>[x.type,x.value]));return a.year+'-'+a.month+'-'+a.day}
function chinaClock(){return new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Shanghai',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date())}
function inTrip(){const d=chinaDate();return d>='2026-12-05'&&d<='2026-12-21'?days.find(x=>x.date===d):null}

function upcomingStop(acts){const hm=chinaClock();return acts.find(a=>a.time>=hm)||acts[acts.length-1]}
function dayAnchor(day,act){const points=mapLocations[day.city]||[];return points.find(x=>x.act===act?.id)||points.find(x=>x.act&&curActivities().some(a=>a.date===day.date&&a.id===x.act))||{lat:WEATHER[day.city].lat,lon:WEATHER[day.city].lon,name:'centre-ville'}}
function dayRestaurants(day,act){if(day.date==='2026-12-13'||day.date==='2026-12-14')return [];const anchor=dayAnchor(day,act);return RESTAURANTS.filter(x=>x.city===day.city&&x.type!=='options').map(x=>({...x,approxKm:havKm(anchor.lat,anchor.lon,x.lat,x.lon)})).sort((a,b)=>a.approxKm-b.approxKm).slice(0,3)}

function solarTime(date,lat,lon,rise){const d=new Date(date+'T00:00:00Z'),y=d.getUTCFullYear(),n=Math.round((Date.UTC(y,d.getUTCMonth(),d.getUTCDate())-Date.UTC(y,0,0))/86400000),rad=Math.PI/180,norm=x=>(x%360+360)%360,lng=lon/15,t=n+((rise?6:18)-lng)/24,m=.9856*t-3.289,L=norm(m+1.916*Math.sin(m*rad)+.02*Math.sin(2*m*rad)+282.634);let RA=norm(Math.atan(.91764*Math.tan(L*rad))/rad);RA+=(Math.floor(L/90)-Math.floor(RA/90))*90;RA/=15;const sd=.39782*Math.sin(L*rad),cd=Math.cos(Math.asin(sd)),ch=(Math.cos(90.833*rad)-sd*Math.sin(lat*rad))/(cd*Math.cos(lat*rad));if(Math.abs(ch)>1)return '—';const h=(rise?360-Math.acos(ch)/rad:Math.acos(ch)/rad)/15,ut=h+RA-.06571*t-6.622-lng;const mm=Math.round((((ut+8)%24+24)%24)*60)%1440;return String(Math.floor(mm/60)).padStart(2,'0')+':'+String(mm%60).padStart(2,'0')}

async function loadForecasts(force=false){const daysAway=(Date.parse('2026-12-05T00:00:00+08:00')-Date.now())/86400000;if(daysAway>15.5&&!force){forecastCheck='Les prévisions commenceront à couvrir le voyage vers fin novembre';return}if(forecastLoading)return;forecastLoading=true;forecastError='';await Promise.all(Object.entries(WEATHER).map(async([city,c])=>{try{const q=new URLSearchParams({latitude:c.lat,longitude:c.lon,timezone:'Asia/Shanghai',forecast_days:'16',daily:'temperature_2m_max,temperature_2m_min,precipitation_probability_max,weather_code,sunrise,sunset,wind_speed_10m_max'});const res=await fetch('https://api.open-meteo.com/v1/forecast?'+q.toString(),{cache:'no-store'});if(!res.ok)throw Error(res.status);const j=await res.json(),d=j.daily||{};forecastStore[city]={};(d.time||[]).forEach((date,i)=>forecastStore[city][date]={high:d.temperature_2m_max?.[i],low:d.temperature_2m_min?.[i],rain:d.precipitation_probability_max?.[i],wind:d.wind_speed_10m_max?.[i],code:d.weather_code?.[i],rise:d.sunrise?.[i]?.slice(11,16),set:d.sunset?.[i]?.slice(11,16)})}catch(e){forecastError='Certaines prévisions sont indisponibles'}}));forecastLoading=false;forecastCheck=new Date().toLocaleString('fr-FR');if(['weather','program','overview'].includes(S.pagemode))render()}

function closeTravelMap(){if(travelMap){try{travelMap.remove()}catch(e){}travelMap=null}travelMapMarkers=[]}
function havKm(la1,lo1,la2,lo2){const rad=Math.PI/180,dlat=(la2-la1)*rad,dlon=(lo2-lo1)*rad;const a=Math.sin(dlat/2)**2+Math.cos(la1*rad)*Math.cos(la2*rad)*Math.sin(dlon/2)**2;return 12742*Math.asin(Math.min(1,Math.sqrt(a)))}
function currentCityDistance(city){const v=WEATHER[city];return geoCurrent?havKm(geoCurrent.lat,geoCurrent.lon,v.lat,v.lon):Infinity}

function beijingFoodTips(){const foods=BEIJING_DISCOVERIES.filter(x=>x.cat==='food'&&(x.title.includes('Niujie')||x.title.includes('Plats')||x.title.includes('Bayi Laoyou')||x.title.includes('Xiyu Yipin')));return `<details class="merged-extra"><summary>🍜 Adresses conseillées & spécialités pékinoises <span>Voir ↘</span></summary><div class="merged-tip-grid">${foods.map(x=>`<div class="panel"><h3>${esc(x.title)}</h3><b class="resto-chinese">${esc(x.cn)}</b><p>${esc(x.desc)}</p><p class="compact">${esc(x.tip)}</p>${!x.title.includes('Plats')?locationActions(x.title,x.cn,x.place,'Beijing, China',{compact:true}):''}</div>`).join('')}</div></details>`}
function beijingExtras(){const groupNames={shopping:'🛍 Shopping et centres commerciaux',market:'🏮 Marchés et nocturnes',visit:'🏛 Autres visites'};return `<section class="section" id="beijing-more"><div class="section-head"><div><div class="overline">Pékin · autres options</div><h2>Shopping, marchés & idées supplémentaires</h2><p>Ces adresses sont des alternatives à votre programme, et non des visites supplémentaires obligatoires. Pour les boutiques non épinglées, ouvrir AMap.</p></div></div>${['shopping','market','visit'].map(type=>{const items=BEIJING_DISCOVERIES.filter(x=>x.cat===type);return `<details class="merged-extra" ${type==='shopping'?'open':''}><summary>${groupNames[type]} <span>${items.length} idées ↘</span></summary><div class="restaurant-grid">${items.map(x=>`<div class="restaurant-card"><span class="label">${esc(x.label)}</span><h3>${esc(x.title)}</h3><b class="resto-chinese">${esc(x.cn)}</b><p class="compact">📍 ${esc(x.place)}</p><p>${esc(x.desc)}</p><small class="resto-reliability">${esc(x.tip)}</small><div class="restaurant-actions">${x.day?`<button class="button soft sm" data-date="${x.day}">Voir le ${Number(x.day.slice(-2))} déc.</button>`:''}${x.url?`<a class="button line sm" href="${safeURL(x.url)}" target="_blank" rel="noopener">Source ↗</a>`:''}</div>${locationActions(x.title,x.cn,x.place,'Beijing, China',{compact:true})}</div>`).join('')}</div></details>`}).join('')}</section>`}
function mapPage(){const city=S.mapCity||'Beijing',name=cities.find(c=>c.en===city)?.name||city,food=S.mapView==='restaurants',restaurants=chosenFoodList(),places=mapLocations[city]||[],list=food?restaurants:places,inCity=geoCurrent&&currentCityDistance(city)<80;return `<div class="overline">Cartographie · restaurants · itinéraires</div><h1 class="page-title">Cartes & lieux</h1><p class="subtitle">Carte grand format et adresses en chinois. Chaque adresse propose AMap, Google Maps, Apple Plans et la copie du nom chinois. Google Maps peut être indisponible en Chine continentale.</p><div class="map-city-tabs">${cities.map(c=>`<button data-map-city="${c.en}" class="${city===c.en?'active':''}">${c.name}</button>`).join('')}</div><div class="map-toolbar"><div class="map-toggle"><button class="${food?'active':''}" data-map-view="restaurants">🍜 Restaurants (${RESTAURANTS.filter(r=>r.city===city).length})</button><button class="${!food?'active':''}" data-map-view="places">📍 Visites & lieux (${places.length})</button></div>${city==='Beijing'?'<button class="button line" data-map-more>🛍 Shopping & marchés</button>':''}<button class="button soft" data-map-locate>◎ Autour de moi</button></div>${food?`<div class="map-food-filters">${[['all','Tous'],['halal','Halal'],['vegetarian','100 % végétarien'],['options','Options à confirmer']].map(([id,n])=>`<button data-map-food="${id}" class="${S.mapFood===id?'active':''}">${n}</button>`).join('')}</div>`:''}
<div class="travel-map-wrap"><div id="travel-map" class="travel-map" role="application" aria-label="Carte interactive de ${name}"></div><div id="travel-map-fallback" hidden class="map-fallback"><p>Carte de secours</p><iframe src="${osmEmbed(places[0]||{lat:WEATHER[city].lat,lon:WEATHER[city].lon})}" title="Carte de secours" loading="lazy"></iframe></div></div><div class="map-caption"><span><i class="legend-dot halal-dot"></i>Halal</span><span><i class="legend-dot veggie-dot"></i>Végétarien</span><span><i class="legend-dot option-dot"></i>À vérifier</span><span><i class="legend-dot blue-dot"></i>Ma position</span></div><p class="map-hint">${mapHint()} Les épingles sont indicatives et ne garantissent ni ouverture ni disponibilité; utilisez l'adresse exacte sur AMap ou Google Maps pour vous guider. La carte nécessite Internet et peut être moins fiable en Chine continentale.</p>
${food?`<div class="resto-list-head"><div><div class="overline">Adresses repérées · ${name}</div><h2>${restaurants.length} restaurants${inCity?' · triés par proximité':''}</h2></div><div class="horizontal" style="flex-wrap:wrap"><button class="button ${S.mapNear?'soft':'line'} sm" data-map-near="${S.mapNear?'off':'on'}">${S.mapNear?'✓ Dans un rayon de '+S.mapRadius+' km':'Voir à proximité'}</button>${S.mapNear?`<select class="field map-radius" id="map-radius"><option value="2" ${S.mapRadius===2?'selected':''}>2 km</option><option value="5" ${S.mapRadius===5?'selected':''}>5 km</option><option value="10" ${S.mapRadius===10?'selected':''}>10 km</option></select>`:''}</div></div><div class="restaurant-grid">${restaurants.map(r=>`<div class="restaurant-card" data-resto-id="${r.id}"><div class="horizontal" style="justify-content:space-between"><span class="restaurant-type type-${r.type}">${r.type==='halal'?'✓ Halal':r.type==='vegetarian'?'🌿 Végétarien':'? Menu à vérifier'}</span>${r.distance!=null?`<strong class="km-value">~${r.distance.toFixed(1)} km</strong>`:''}</div><h3>${esc(r.name)}</h3>${r.name.includes("Pinhuiwei")?`<details class="food-photo-details"><summary>Voir la capture du restaurant</summary><img src="${FOOD_REFERENCE_PHOTOS.pinhuiwei}" loading="lazy" alt="Capture TikTok fournie par le voyageur, Pinhuiwei halal à Shanghai" /></details>`:""}<div class="resto-chinese">${esc(r.cn)}</div><p class="compact">📍 ${esc(r.address)}</p><p>${esc(r.description)}</p><small class="resto-reliability">Repère sur la carte approximatif. Statut et horaires à revérifier.</small><div class="restaurant-actions"><button class="button soft sm" data-resto-focus="${r.id}">Voir sur la carte</button><a class="button line sm" href="${safeURL(r.source)}" target="_blank" rel="noopener">Source ↗</a></div>${locationActions(r.name,r.cn,r.address,r.city,{compact:true})}</div>`).join('')||'<div class="empty"><h3>Aucun restaurant dans cette zone</h3><p>Désactivez le rayon de proximité ou augmentez-le.</p><button class="button soft" data-map-near="off">Afficher tous les restaurants</button></div>'}</div><p class="footnote">Halal = mention dans une source gastronomique ou touristique, pas une certification contrôlée par l’application. En Chine, vérifier 清真 et les ingrédients; à Hong Kong, consulter les certificats locaux. Végétarien n’implique pas automatiquement une cuisine sans alcool.</p>${city==='Beijing'?beijingFoodTips():''}`: `<div class="resto-list-head"><h2>${places.length} lieux repérés · ${name}</h2></div><div class="restaurant-grid">${places.map(p=>`<div class="restaurant-card"><h3>${esc(p.name)}</h3><b class="resto-chinese">${esc(p.cn||'')}</b><p>${esc(p.desc||'')}</p><div class="restaurant-actions"><button class="button soft sm" data-resto-focus="${p.id}">Voir sur la carte</button>${p.act?`<button class="button line sm" data-detail="${p.act}">Programme ↗</button>`:''}</div>${locationActions(p.name,p.cn,p.address||'',city,{compact:true})}</div>`).join('')}</div>${city==='Beijing'?beijingExtras():''}`}`}

function weatherPage(){return `<div class="overline">Températures & durée du jour</div><h1 class="page-title">Météo & soleil</h1><p class="subtitle">Climat de décembre et horaires solaires pour les 17 journées. Les prévisions réelles, disponibles jusqu'à 16 jours à l'avance, remplaceront les moyennes saisonnières.</p><div class="city-row">${cities.map(c=>`<div class="weather-city-card"><b>${c.name}</b><strong>${WEATHER[c.en].low} à ${WEATHER[c.en].high} °C</strong><small>Moyennes habituelles</small></div>`).join('')}</div><section class="section"><div class="section-head"><h2>Jour par jour</h2><button class="button line sm" data-weather-refresh>↻ Actualiser</button></div><div class="weather-table">${days.map(d=>{const w=weatherDay(d.date,d.city);return `<button class="weather-date-row" data-date="${d.date}"><span><b>${d.dow} ${d.date.slice(-2)}/12</b><small>${cities.find(c=>c.en===d.city)?.name}</small></span><strong>${w.icon} ${w.low} / ${w.high} °C</strong><span>🌅 ${w.rise}<br>🌇 ${w.set}</span><small>${w.pred?'Prévision':'Saison'}</small></button>`}).join('')}</div><p class="footnote">« Saison » signifie températures moyennes de décembre, pas la météo du jour. Lever et coucher calculés astronomiquement, à quelques minutes près. Toutes les heures sont locales UTC+8. ${forecastError?esc(forecastError):''}</p></section><div class="section panels"><div class="panel"><h3 class="panel-title">Actualisation</h3><p>La météo Open-Meteo s'affichera automatiquement lorsqu'elle couvre les dates du voyage.</p><p class="compact">${forecastCheck||'Prévisions pas encore disponibles pour les dates choisies'}</p><a class="link" href="https://open-meteo.com/en/docs" target="_blank" rel="noopener">Source : Open-Meteo ↗</a></div><div class="panel"><h3 class="panel-title">Tenues à prévoir</h3>${cities.map(c=>`<p><b>${c.name} :</b> ${WEATHER[c.en].tip}</p>`).join('')}</div></div>`}

function localHotelLinks(){const name=String(data.hotel||'').trim(),cn=String(data.hotelChinese||'').trim();return !name&&!cn?'<p class="footnote">Saisissez le nom ou l’adresse chinoise pour activer Google Maps, Apple Plans et la copie du nom chinois.</p>':locationActions(name||cn,cn,'','Beijing, China')}
function prepare(){let done=todos.filter(x=>data.checked[x.id]).length;let groups=[...new Set(todos.map(t=>t.category))];return `<div class="overline">Avant de décoller</div><h1 class="page-title">Préparatifs & applications</h1><p class="subtitle">Une checklist concrète, pas une liste de conseils génériques. Chaque coche est sauvegardée localement.</p><div class="section panels"><div class="panel"><h3 class="panel-title">Préparation du voyage</h3><p class="muted">${done} actions terminées sur ${todos.length}</p><div class="progress"><div style="width:${Math.round(done/todos.length*100)}%"></div></div><p class="footnote">La réservation et la préparation restent deux choses différentes : une coche n’équivaut pas à une réservation confirmée.</p></div><div class="panel"><h3 class="panel-title">Hôtel de Pékin</h3><label class="field-label">Nom de l’hôtel</label><input class="field" id="hotel" placeholder="Votre hôtel réservé à Jianguomen" value="${esc(data.hotel)}"><label class="field-label">Adresse en chinois, à montrer au chauffeur</label><input class="field" id="hotelChinese" placeholder="Adresse complète en chinois" value="${esc(data.hotelChinese)}"><label class="field-label">Adresse / consignes de check-in</label><input class="field" id="hotelAddress" placeholder="Adresse complète, confirmation, etc." value="${esc(data.hotelAddress)}"><div id="local-hotel-actions">${localHotelLinks()}</div><p class="footnote">La réservation est confirmée. Renseignez ici les coordonnées exactes de l’hôtel, qui resteront sur cet appareil tant que vous ne les exportez pas. N’enregistrez pas de numéro de réservation dans le dépôt GitHub public.</p></div></div>
<section class="section"><div class="panel"><div class="overline">Accès pendant le voyage</div><h3 class="panel-title">Programme disponible hors connexion</h3><p class="compact">Ouvrir cette application au moins une fois avec Internet, puis la garder dans vos favoris. Sur iPhone, Safari → Partager → Sur l'écran d'accueil permet de la lancer comme une application. Le programme, les adresses en chinois et les notes locales peuvent rester accessibles hors ligne après installation de la version en cache.</p><p class="footnote">Les cartes complètes, les tuiles non encore consultées, la météo actualisée, les services de réservation et les liens de navigation nécessitent généralement Internet. Un fond de carte précédemment consulté peut parfois rester disponible.</p><button class="button soft sm" data-offline-check>Vérifier le programme hors connexion</button></div></section><section class="section"><div class="panel sf-guide"><div class="overline">Bagages · logistique</div><h2 class="panel-title">Envoi de valises avec SF Express (顺丰速运)</h2><p>Possible en Chine continentale après devis, mais les 30 à 80 CNY et la livraison automatique le lendemain vus sur TikTok ne sont pas garantis pour 20 kg.</p><div class="sf-steps"><div><b>1. Demander l’accord des deux hôtels</b><p>Confirmer le ramassage par le coursier et l’acceptation d’une valise au nom de votre réservation avant le check-in.</p></div><div><b>2. Demander un devis</b><p>WeChat mini-programme 顺丰速运 → 寄快递 → 上门取件, ou 寄大件 pour gros colis. Saisir poids, dimensions et adresses.</p></div><div><b>3. Vérifier le délai réel</b><p>Contrôler le prix final, l’emballage, le suivi, l’assurance éventuelle et les délais. Ne rien supposer.</p></div><div><b>4. Garder l’essentiel avec soi</b><p>Passeports, médicaments, argent, électronique et vêtements pour 48 h. Éviter l’expédition transfrontalière Shenzhen → Hong Kong.</p></div></div><div class="discovery-actions"><button class="button soft sm" data-copy="请问酒店可以代我交给顺丰快递员寄行李吗？收件酒店已经同意代收并保管。请帮我确认运费和预计送达日期。">Copier la question en chinois</button><a class="button line sm" href="https://www.sf-express.com/chn/sc/price-query" target="_blank" rel="noopener">Calcul de prix officiel ↗</a></div></div></section><section class="section"><div class="section-head"><h2>Checklist de préparation</h2><span class="day-tag">${Math.round(done/todos.length*100)} % terminé</span></div><div class="two-col">${groups.map(g=>`<div class="panel"><div class="overline">${g}</div>${todos.filter(x=>x.category===g).map(t=>`<label class="check ${data.checked[t.id]?'done':''}"><input type="checkbox" data-check="${t.id}" ${data.checked[t.id]?'checked':''}><div><b>${esc(t.name)}</b><small>${esc(t.desc)}</small></div></label>`).join('')}</div>`).join('')}</div></section>
<section class="section"><div class="section-head"><div><h2>La boîte à outils chinoise</h2><p>À installer et configurer en France, idéalement avant le départ.</p></div></div><div class="three-col">${appList.map(a=>`<div class="app-item"><div class="app-icon">${a.icon}</div><div><b>${esc(a.name)} <small class="muted">${esc(a.cn)}</small></b><br><span class="pill">${esc(a.importance)}</span><p>${esc(a.desc)}</p><a href="${safeURL(a.link)}" target="_blank" rel="noopener" class="link">Site officiel / service ↗</a></div></div>`).join('')}</div></section><section class="section"><div class="panel"><div class="overline">Rappels utiles</div><div class="flash amber"><span class="flash-icon">⚠️</span><div><b>Connectivité en Chine</b><br>Les services internationaux (Google, WhatsApp, etc.) peuvent être inaccessibles sur certaines connexions locales. Ne pas attendre l’arrivée pour tester la solution data.</div></div><div class="flash"><span class="flash-icon">🍲</span><div><b>Repas halal</b><br>Rechercher « 清真 » dans AMap / Dianping, puis vérifier sur place. Ce mot ne garantit pas à lui seul tous les critères recherchés.</div></div><div class="flash blue"><span class="flash-icon">🧾</span><div><b>Passeports</b><br>Les billets de sites, trains et formalités peuvent être liés au numéro de passeport. Garder les originaux disponibles pour les contrôles.</div></div></div></section>`}
function hotelsPage(){const stays=[['Shanghai','9 au 17 décembre · 8 nuits'],['Shenzhen','17 au 19 décembre · 2 nuits'],['Hong Kong','19 au 21 décembre · 2 nuits']];return `<div class="overline">Hébergement · comparaison</div><h1 class="page-title">Hôtels suggérés</h1><p class="subtitle">Pékin est déjà réservé. Pour les trois autres villes, comparez les emplacements ci-dessous; aucun tarif ni disponibilité précis pour vos dates n'a été confirmé.</p><div class="panel"><b>🏨 Pékin du 5 au 9 décembre : confirmé</b><p class="compact">Quartier Jianguomen / Yong’anli. Conserver les détails de votre réservation dans Préparatifs, sur votre appareil.</p></div>${stays.map(([city,dates])=>`<section class="section"><div class="section-head"><div><div class="overline">${dates}</div><h2>${city}</h2></div></div><div class="hotel-grid">${hotelsSuggested.filter(h=>h.city===city).map((h,i)=>`<div class="panel hotel-card"><div class="horizontal" style="justify-content:space-between"><span class="label">${h.tier}</span>${i===0?'<span class="label orange">Ma présélection</span>':''}</div><h3>${h.name}</h3><p class="compact">${h.cn}</p><p class="compact">📍 ${h.address}</p><p>${h.reason}</p><div class="hotel-actions"><button class="button ${data.hotelChoices?.[city]===h.id?'soft':'line'} sm" data-hotel-choice="${h.id}">${data.hotelChoices?.[city]===h.id?'✓ Retenu pour comparaison':'Retenir cet hôtel'}</button></div>${locationActions(h.name,h.cn,h.address,city,{compact:true})}</div>`).join('')}</div><p class="footnote">Choisir un hôtel ici n’effectue pas de réservation. Vérifier le tarif pour deux personnes, le petit-déjeuner, l’annulation gratuite, l’accès métro et une chambre non-fumeur avec fenêtre.</p></section>`).join('')}`}
function budget(){let cats=[['Vols internationaux','Confirmés','Vols CDG → PEK et HKG → CDG, prix non renseignés.'],['Hôtels','Pékin confirmé','Pékin : 4 nuits réservées. Shanghai : 8 nuits, Shenzhen : 2 nuits, Hong Kong : 2 nuits à réserver. Voir Hôtels suggérés.'],['Transports en Chine','À réserver','TGV Pékin → Shanghai, vol Shanghai → Shenzhen et train Shenzhen → Hong Kong.'],['Activités & excursions','Estimations','Pékin, Shanghai, Suzhou, Hangzhou, Shenzhen et Hong Kong : consulter les fiches par journée.'],['Repas & shopping','À définir','Budgets par jour non fixés.']];let bookings=[['Vol intérieur SHA → SZX','17 décembre · horaire et bagages à réserver','c1702'],['TGV Futian → Hong Kong','19 décembre · billets et passeports','c1901'],['Shanghai Tower','10 décembre · billet selon météo','c1004'],['Cité interdite','6 décembre · ouverture billetterie prévue 29 novembre','b06'],['Tian’anmen','6 décembre · réserver par canal adapté','b05'],['Mutianyu / transport','7 décembre · A/R et météo','b10'],['Palais d’Été','8 décembre · entrée combinée à confirmer','b17'],['Temple du Ciel','9 décembre · billet combiné','b23'],['TGV Pékin–Shanghai','9 décembre · train non choisi','b25']];return `<div class="overline">Finance & logistique</div><h1 class="page-title">Budget & réservations</h1><p class="subtitle">Une base de pilotage sans inventer de prix d’hôtels, de vols ou d’horaires non réservés.</p><div class="section two-col"><div class="panel"><h3 class="panel-title">Vue du budget</h3>${cats.map((x,i)=>`<div class="budget-row"><div><b>${x[0]}</b><div class="compact">${x[2]}</div></div><span class="pill ${i===0?'':'todo'}" style="height:fit-content;white-space:nowrap">${x[1]}</span></div>`).join('')}<p class="footnote">Toutes les sommes en CNY présentées dans les fiches sont des tarifs connus ou des estimations clairement signalées. Aucune conversion euro automatique, car les cours changent.</p></div><div class="panel"><h3 class="panel-title">Dates structurantes</h3><div class="check"><span>✈️</span><div><b>4 déc. • Paris → Pékin</b><small>Air France AF382 · 22h40 CDG T2E → 16h55 PEK T2 le 5 déc.</small></div></div><div class="check"><span>🚄</span><div><b>9 déc. • Pékin → Shanghai</b><small>Train G à réserver, depuis Beijing South.</small></div></div><div class="check"><span>✈️</span><div><b>17 déc. • Shanghai → Shenzhen</b><small>Avion suggéré, vol et horaire non choisis.</small></div></div><div class="check"><span>🚄</span><div><b>19 déc. • Shenzhen → Hong Kong</b><small>Train à grande vitesse suggéré, frontières à franchir.</small></div></div><div class="check"><span>✈️</span><div><b>21 déc. • Hong Kong → Paris</b><small>Air France AF185 · 22h45 HKG → 05h50 CDG le 22 déc.</small></div></div></div></div><section class="section"><div class="panel"><div class="overline">Dates clés de réservation</div><h3 class="panel-title">À ne pas manquer</h3><div class="info-line"><span class="emoji">📅</span><div><b>À partir du 9 novembre</b><p>Demande anticipée possible sur 12306 pour le TGV Pékin → Shanghai du 9 décembre, dans le dispositif pilote (30 à 17 jours avant). Ce n’est pas une confirmation de siège.</p></div></div><div class="info-line"><span class="emoji">🚄</span><div><b>25 novembre</b><p>Début de la vente ordinaire à 15 jours pour le train du 9 décembre, sous réserve des horaires d’ouverture de vente de la gare.</p></div></div><div class="info-line"><span class="emoji">🚄</span><div><b>29 et 30 novembre</b><p>Ouverture normale des billets pour les excursions du 13 décembre (Suzhou) et du 14 décembre (Hangzhou), fenêtre de 15 jours, jour de départ inclus.</p></div></div><div class="info-line"><span class="emoji">✈️</span><div><b>Dès maintenant</b><p>Comparer les hôtels de Shanghai, Shenzhen et Hong Kong, et réserver le vol intérieur direct SHA → SZX du 17 décembre. Vérifier les bagages et la certification 3C des batteries externes.</p></div></div><div class="info-line"><span class="emoji">🇭🇰</span><div><b>5 décembre</b><p>Ouverture normale de la vente à 15 jours pour Futian → Hong Kong West Kowloon du 19 décembre.</p></div></div><p class="footnote">Les fenêtres de réservation peuvent évoluer. Vérifier l’application 12306 et les horaires exacts de vente; les étapes ci-dessus n’effectuent aucun achat.</p></div></section><section class="section"><div class="section-head"><h2>Suivi des réservations du voyage</h2></div><div class="two-col">${bookings.map(([n,sub,id])=>`<div class="panel"><div class="horizontal" style="justify-content:space-between"><b>${n}</b><span class="pill ${data.reservations[id]?'':'todo'}">${data.reservations[id]?'Réservé':'À faire'}</span></div><p class="compact">${sub}</p><div class="horizontal" style="justify-content:space-between;margin-top:13px"><button class="button line sm" data-detail="${id}">Voir détails ↗</button><button class="button ${data.reservations[id]?'soft':'line'} sm" data-reservation="${id}">${data.reservations[id]?'✓ Marqué réservé':'Marquer réservé'}</button></div></div>`).join('')}</div><p class="footnote">« Marquer réservé » est une case de suivi manuelle, sans achat réel.</p></section><section class="section"><div class="panel"><div class="overline">Sites fiables</div><h3 class="panel-title">Sources officielles et utiles</h3><div class="two-col">${sources.map(x=>`<a class="source-link" href="${safeURL(x.u)}" rel="noopener" target="_blank">↗ ${esc(x.t)}</a>`).join('')}</div></div></section>`}
function share(){return `<div class="overline">Sauvegarde</div><h1 class="page-title">Partager & exporter</h1><p class="subtitle">Pour transférer les modifications d’un téléphone à l’autre, envoyez un lien de mise à jour ou un fichier de sauvegarde. Il n’y a pas de synchronisation en temps réel.</p><div class="section panels"><div class="panel"><h3 class="panel-title">Exporter ou importer les données</h3><p>Sauvegarde JSON des notes, réservations, hôtels et activités personnalisées.</p><div class="horizontal" style="margin:16px 0;flex-wrap:wrap"><button class="button" data-share-link>↗ Envoyer les modifications</button><button class="button line" data-export>↓ Exporter JSON</button><button class="button line" data-import>↑ Importer JSON</button></div><p class="footnote">Le lien transfère les notes, activités, réservations marquées et checklist; il exclut les coordonnées d’hôtel enregistrées localement. Toute personne possédant le lien peut en lire le contenu.</p><p class="footnote">L’import remplace les données locales. Exporter avant d’importer.</p></div><div class="panel"><h3 class="panel-title">Lien de l'application</h3><a class="link" href="https://yrb-pixel.github.io/yoyo-apps/Voyage-Chine-2026.html" target="_blank" rel="noopener">Ouvrir l’application ↗</a><p>Pour récupérer les changements : ouvrir le lien envoyé sur le second téléphone, accepter la fusion, puis refaire l'opération après de nouvelles modifications. Une synchronisation instantanée nécessiterait un stockage partagé et une authentification.</p></div></div><div class="section two-col"><div class="panel"><h3 class="panel-title">Résumé</h3><button class="button soft" data-copy-summary>⧉ Copier le résumé</button></div><div class="panel"><h3 class="panel-title">Réinitialiser</h3><button class="button warn" data-reset>↺ Réinitialiser</button></div></div><p class="footnote">Éviter d’enregistrer des numéros de passeport ou des données bancaires.</p>`}
function detail(a){S.detailId=a.id;const html=`<div class="modal-head"><div><div class="overline">${esc(days.find(d=>d.date===a.date)?.dow||'')} ${a.date.slice(-2)} décembre · ${esc(a.time)}–${esc(a.end)}</div><h2>${esc(a.name)}</h2></div><button class="close" data-close aria-label="Fermer">×</button></div><div class="detail-cover" ${pic(a.photo||im.beijing)}>${esc(a.cn||'')}</div><p style="line-height:1.7;color:#526f69">${esc(a.desc)}</p><div class="act-row">${tagFor(a)}<span class="label">${esc(a.duration||'')}</span><span class="label">${esc(a.tag||'')}</span></div><div class="detail-block"><h3>✦ Ce que vous ferez sur place</h3><ul>${(a.details||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="detail-block"><h3>🚗 Trajet porte à porte</h3><p>${esc(a.route||'À compléter')}</p><div class="subcard"><b>📱 Application à ouvrir</b><p>${esc(a.app||'AMap / DiDi')}</p><p><b>Adresse à copier / montrer au chauffeur</b> <span class="break">${esc(a.cn||'À compléter')}</span></p>${locationActions(a.name,a.cn,a.address||'',cityForActivity(a))}</div></div><div class="detail-block"><h3>🎟 Réservation & budget</h3><p><b>Statut :</b> ${esc(a.reserve||'À compléter')}</p><p><b>Budget :</b> ${esc(a.budget||'Non précisé')}</p>${a.url?`<a href="${safeURL(a.url)}" target="_blank" rel="noopener" class="link">Ouvrir la source / billetterie ↗</a>`:''}<div style="margin-top:13px"><button class="button ${data.reservations[a.id]?'soft':'line'} sm" data-reservation="${a.id}">${data.reservations[a.id]?'✓ Réservation marquée comme effectuée':'Marquer réservé (suivi uniquement)'}</button></div></div><div class="detail-block"><h3>💡 Le conseil important</h3><p>${esc(a.tip||'Prévoir une marge.')}</p></div>${String(a.id).startsWith('x')?`<div style="margin-top:16px"><button data-delete-custom="${a.id}" class="button warn sm">Supprimer cette activité personnalisée</button></div>`:''}`;openModal(html)}
function openModal(html){document.getElementById('modal').innerHTML=html;document.getElementById('modal-bg').classList.add('show');document.body.style.overflow='hidden'}
function closeModal(){document.getElementById('modal-bg').classList.remove('show');document.body.style.overflow='';S.detailId=null}
function addActivity(date){S.detailId=null;openModal(`<div class="modal-head"><div><div class="overline">Personnalisation</div><h2>Ajouter une idée à la journée</h2><p class="compact">${esc(date)}</p></div><button class="close" data-close>×</button></div><form id="add-form"><input type="hidden" name="date" value="${esc(date)}"><label class="field-label">Titre de l'activité *</label><input class="field" name="name" required maxlength="100" placeholder="Ex. Atelier de calligraphie"><div class="two-col"><div><label class="field-label">Début</label><input class="field" name="time" type="time" value="16:00" required></div><div><label class="field-label">Fin</label><input class="field" name="end" type="time" value="17:00" required></div></div><label class="field-label">Description</label><textarea class="field" name="desc" rows="3" placeholder="Ce qu'on veut faire"></textarea><label class="field-label">Adresse / lieu en chinois (si connu)</label><input class="field" name="cn" placeholder="Nom ou adresse"><label class="field-label">Comment s’y rendre</label><textarea class="field" name="route" rows="2" placeholder="Métro, DiDi, à pied…"></textarea><label class="field-label">Lien utile (https://)</label><input class="field" name="url" placeholder="https://"><div style="margin-top:17px"><button class="button full" type="submit">Ajouter au programme</button></div></form>`)}

function snapshotForShare(){return {checked:data.checked,reservations:data.reservations,notes:data.notes,selectedWall:data.selectedWall,custom:data.custom,hotelChoices:data.hotelChoices,deadlineDone:data.deadlineDone,hiddenActivities:data.hiddenActivities||{},slotOverrides:data.slotOverrides||{}}}
function encodeShareState(payload){const bytes=new TextEncoder().encode(JSON.stringify(payload));let b='';for(let i=0;i<bytes.length;i++)b+=String.fromCharCode(bytes[i]);return btoa(b).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function decodeShareState(text){const b64=text.replace(/-/g,'+').replace(/_/g,'/');const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));return JSON.parse(new TextDecoder().decode(bytes))}
function sharedUrl(){const payload={app:'WANDER CHINA 2026',version:2,updatedAt:new Date().toISOString(),state:snapshotForShare()};return location.origin+location.pathname+location.search+'#partage='+encodeShareState(payload)}
async function shareUpdates(){const url=sharedUrl();if(url.length>9000){showToast('Beaucoup de notes : utilisez Exporter JSON pour partager.');return}try{if(navigator.share){await navigator.share({title:'Chine 2026 · mise à jour du programme',url});return}copyText(url)}catch(e){if(e.name!=='AbortError')copyText(url)}}
function safeSharedObject(value){return value&&typeof value==='object'&&!Array.isArray(value)?value:{}}
function acceptShareLink(){const hash=location.hash||'';if(!hash.startsWith('#partage='))return;try{const payload=decodeShareState(hash.slice('#partage='.length));if(payload.app!=='WANDER CHINA 2026'||payload.version!==2||!payload.state||typeof payload.state!=='object')throw Error('Format invalide');const incoming=payload.state;
if(!confirm('Importer les modifications partagées sur cet appareil ? Les notes communes du lien remplaceront celles des mêmes journées. Aucune synchronisation automatique.'))return;
const boolKeys=['checked','reservations','deadlineDone','hiddenActivities'];for(const key of boolKeys){const obj=safeSharedObject(incoming[key]);data[key]={...safeSharedObject(data[key]),...Object.fromEntries(Object.entries(obj).filter(([k,v])=>typeof k==='string'&&k.length<90&&typeof v==='boolean'))}}
const noteObj=safeSharedObject(incoming.notes);data.notes={...safeSharedObject(data.notes),...Object.fromEntries(Object.entries(noteObj).filter(([k,v])=>/^2026-12-\d\d$/.test(k)&&typeof v==='string').map(([k,v])=>[k,v.slice(0,5000)]))};
if(['comfort','adventure'].includes(incoming.selectedWall))data.selectedWall=incoming.selectedWall;
data.hotelChoices={...safeSharedObject(data.hotelChoices),...safeSharedObject(incoming.hotelChoices)};
data.slotOverrides={...safeSharedObject(data.slotOverrides),...Object.fromEntries(Object.entries(safeSharedObject(incoming.slotOverrides)).filter(([key,v])=>/^[a-zA-Z0-9-]{2,40}$/.test(key)&&v&&typeof v==='object'&&/^\d\d:\d\d$/.test(String(v.time||''))&&/^\d\d:\d\d$/.test(String(v.end||''))).map(([key,v])=>[key,{time:v.time,end:v.end}]))};
const theirs=Array.isArray(incoming.custom)?incoming.custom:[];const old=new Map((Array.isArray(data.custom)?data.custom:[]).map(x=>[String(x.id),x]));for(const a of theirs.slice(0,100)){if(!a||!/^x\d+$/.test(String(a.id))||!days.some(d=>d.date===a.date)||typeof a.name!=='string')continue;old.set(String(a.id),{id:String(a.id),date:a.date,name:a.name.slice(0,150),time:String(a.time||'12:00').slice(0,5),end:String(a.end||'13:00').slice(0,5),desc:String(a.desc||'').slice(0,3000),cn:String(a.cn||'').slice(0,250),route:String(a.route||'À vérifier dans AMap').slice(0,2000),url:/^https:\/\//i.test(String(a.url||''))?String(a.url).slice(0,1000):'',tag:'Idée personnalisée',type:'custom',cost:0,priority:'optional',photo:im.beijing,details:[String(a.desc||'').slice(0,800)],app:'AMap / DiDi',reserve:'À confirmer',budget:'À estimer',tip:'Vérifier horaires et transport avant de confirmer.'})}data.custom=[...old.values()];
save();history.replaceState(null,'',location.pathname+location.search);render();showToast('Modifications importées sur cet appareil !')
}catch(e){alert('Lien de partage non reconnu : '+e.message)}
}

function exportData(){const payload={app:'WANDER CHINA 2026',version:1,exportedAt:new Date().toISOString(),state:data};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='chine-2026-younes-zineb-sauvegarde.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);showToast('Sauvegarde JSON exportée.');}
async function checkOfflineReady(){if(!('caches' in window)){showToast('Cache indisponible dans ce navigateur.');return}try{const cache=await caches.open('wander-china-shell-v3');const file=await cache.match('./Voyage-Chine-2026.html');showToast(file?'Programme présent dans le cache hors ligne.':'Ouvrez le programme en ligne puis actualisez la page.')}catch(e){showToast('Cache non accessible. Vérifiez la navigation privée.')}}
function updateConnectivity(){const el=document.getElementById('offline-indicator');if(el)el.hidden=navigator.onLine!==false}
function copyText(s){if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(s).then(()=>showToast('Texte copié !')).catch(()=>fallbackCopy(s))}else fallbackCopy(s)}
function fallbackCopy(s){const a=document.createElement('textarea');a.value=s;document.body.appendChild(a);a.select();try{document.execCommand('copy');showToast('Texte copié !')}catch(e){showToast('Copie non disponible : sélectionner le texte manuellement.')}a.remove()}
function summary(){return `CHINE 2026 · ITINÉRAIRE
05/12 Pékin (4 nuits) · 09/12 Shanghai (8) · 17/12 Shenzhen (2) · 19/12 Hong Kong (2)
Grande Muraille : ${data.selectedWall==='comfort'?'télécabine A/R':'marche + luge si possible'}
${curActivities().map(a=>a.date+' '+a.time+' '+a.name).join('\n')}`}
function mapSearch(q){window.open('https://www.amap.com/search?query='+encodeURIComponent(q),'_blank','noopener')}
function clickHandler(e){const b=e.target.closest('[data-nav],[data-date],[data-open-city],[data-map-city],[data-map-view],[data-map-more],[data-map-food],[data-map-locate],[data-map-near],[data-resto-focus],[data-deadline-id],[data-show-deadlines],[data-detail],[data-activity-visibility],[data-swap-next],[data-close],[data-wall],[data-check],[data-reservation],[data-open-add],[data-share-link],[data-offline-check],[data-export],[data-import],[data-copy-summary],[data-reset],[data-copy],[data-map],[data-map-focus],[data-weather-refresh],[data-hotel-choice],[data-delete-custom]');if(!b)return;
if(b.dataset.nav){nav(b.dataset.nav);return}
if(b.dataset.date){const withinDayPicker=!!b.closest('.day-tabs');const previousY=window.scrollY;S.selectedDate=b.dataset.date;if(withinDayPicker&&S.pagemode==='program'){render();window.scrollTo({top:previousY,behavior:'instant'})}else{nav('program')}return}
if(b.dataset.openCity){const d=days.find(x=>x.city===b.dataset.openCity);if(d){S.selectedDate=d.date;nav('program')}return}
if(b.dataset.mapCity){S.mapCity=b.dataset.mapCity;S.mapPoint=mapLocations[S.mapCity][0].id;S.mapNear=false;renderMapWithoutJump();return}
if(b.dataset.mapView){S.mapView=b.dataset.mapView;renderMapWithoutJump();return}
if(b.hasAttribute('data-map-more')){S.mapCity='Beijing';S.mapView='places';renderMapWithoutJump();setTimeout(()=>document.getElementById('beijing-more')?.scrollIntoView({behavior:'smooth',block:'start'}),60);return}
if(b.dataset.mapFood){S.mapFood=b.dataset.mapFood;renderMapWithoutJump();return}
if(b.hasAttribute('data-map-locate')){requestMapPosition();return}
if(b.dataset.mapNear){if(b.dataset.mapNear==='on'&&!geoCurrent){requestMapPosition()}else{S.mapNear=b.dataset.mapNear==='on';renderMapWithoutJump()}return}
if(b.dataset.restoFocus){focusTravelMarker(b.dataset.restoFocus);window.scrollTo({top:document.getElementById('travel-map')?.getBoundingClientRect().top+window.scrollY-120,behavior:'smooth'});return}
if(b.dataset.deadlineId){data.deadlineDone=data.deadlineDone||{};data.deadlineDone[b.dataset.deadlineId]=!data.deadlineDone[b.dataset.deadlineId];save();const y=window.scrollY;render();window.scrollTo({top:y,behavior:'instant'});return}
if(b.hasAttribute('data-show-deadlines')){S.showAllDeadlines=!S.showAllDeadlines;const y=window.scrollY;render();window.scrollTo({top:y,behavior:'instant'});return}
if(b.dataset.activityVisibility){const id=b.dataset.activityVisibility;data.hiddenActivities=data.hiddenActivities||{};data.hiddenActivities[id]=!data.hiddenActivities[id];save();const y=window.scrollY;render();window.scrollTo({top:y,behavior:'instant'});return}
if(b.dataset.swapNext){swapWithNext(b.dataset.swapNext);return}
if(b.dataset.detail){const a=curActivities().find(x=>x.id===b.dataset.detail);if(a)detail(a);return}
if(b.hasAttribute('data-close')){closeModal();return}
if(b.dataset.wall){data.selectedWall=b.dataset.wall;save();render();return}
if(b.dataset.check){data.checked[b.dataset.check]=b.checked;save();render();return}
if(b.dataset.reservation){data.reservations[b.dataset.reservation]=!data.reservations[b.dataset.reservation];save();render();if(S.detailId){const a=curActivities().find(x=>x.id===S.detailId);if(a)detail(a)}return}
if(b.dataset.openAdd){addActivity(b.dataset.openAdd);return}
if(b.hasAttribute('data-offline-check')){checkOfflineReady();return}
if(b.hasAttribute('data-share-link')){shareUpdates();return}
if(b.hasAttribute('data-export')){exportData();return}
if(b.hasAttribute('data-import')){document.getElementById('file-import').click();return}
if(b.hasAttribute('data-copy-summary')){copyText(summary());return}
if(b.hasAttribute('data-reset')){if(confirm('Effacer les notes et données locales ?')){data=structuredClone(BASE);save();render()}return}
if(b.dataset.copy!==undefined){copyText(b.dataset.copy);return}
if(b.dataset.map){mapSearch(b.dataset.map);return}
if(b.dataset.mapFocus){S.mapPoint=b.dataset.mapFocus;render();return}
if(b.hasAttribute('data-weather-refresh')){loadForecasts(true);showToast('Actualisation météo demandée');return}
if(b.dataset.hotelChoice){const h=hotelsSuggested.find(x=>x.id===b.dataset.hotelChoice);if(h){data.hotelChoices=data.hotelChoices||{};data.hotelChoices[h.city]=h.id;save();render();showToast('Hôtel ajouté à votre présélection locale')}return}
if(b.dataset.deleteCustom){if(confirm('Supprimer cette activité ?')){data.custom=data.custom.filter(x=>x.id!==b.dataset.deleteCustom);save();closeModal();render()}return}
}
function changeHandler(e){let el=e.target;if(el.id==='map-radius'){S.mapRadius=Number(el.value)||5;renderMapWithoutJump();return}if(el.id==='day-note'){data.notes[el.dataset.note]=el.value;save();return}if(['hotel','hotelChinese','hotelAddress'].includes(el.id)){data[el.id]=el.value;save();const x=document.getElementById('local-hotel-actions');if(x)x.innerHTML=localHotelLinks();return}}
function submitHandler(e){if(e.target.id!=='add-form')return;e.preventDefault();let f=new FormData(e.target);let name=String(f.get('name')||'').trim();if(!name)return;let u=String(f.get('url')||'').trim();if(u&&!/^https:\/\//i.test(u)){showToast('Le lien doit commencer par https://');return}let a={id:'x'+Date.now(),date:String(f.get('date')),name,time:String(f.get('time')),end:String(f.get('end')),desc:String(f.get('desc')||'Idée ajoutée par le couple'),cn:String(f.get('cn')||''),route:String(f.get('route')||'À déterminer dans AMap'),url:u,tag:'Idée personnalisée',type:'custom',cost:0,priority:'optional',photo:im.beijing,details:[String(f.get('desc')||'À préciser')],app:'AMap / DiDi',reserve:'À vérifier',budget:'À estimer',tip:'Activité ajoutée librement, vérifier horaires et transport avant de confirmer.'};data.custom.push(a);save();closeModal();render();showToast('Activité ajoutée !')}
const currentTravelDay=inTrip();if(currentTravelDay)S.selectedDate=currentTravelDay.date;
document.addEventListener('click',clickHandler);document.addEventListener('input',changeHandler);document.addEventListener('change',changeHandler);document.addEventListener('submit',submitHandler);document.getElementById('modal-bg').addEventListener('click',e=>{if(e.target.id==='modal-bg')closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});document.getElementById('backup-top').addEventListener('click',exportData);
document.getElementById('file-import').addEventListener('change',e=>{let file=e.target.files?.[0];if(!file)return;let reader=new FileReader();reader.onload=()=>{try{let payload=JSON.parse(reader.result);if(payload.app!=='WANDER CHINA 2026'||!payload.state||!Array.isArray(payload.state.custom))throw Error('Format invalide');if(!confirm('Importer cette sauvegarde et remplacer les choix locaux actuels ?'))return;data={...BASE,...payload.state};delete data.person;delete data.votes;save();closeModal();render();showToast('Sauvegarde importée !')}catch(ex){alert('Impossible de lire la sauvegarde : '+ex.message)}};reader.readAsText(file);e.target.value=''});
render();
acceptShareLink();
loadForecasts();
updateConnectivity();
window.addEventListener('online',updateConnectivity);
window.addEventListener('offline',updateConnectivity);
window.addEventListener('hashchange',acceptShareLink);
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./voyage-chine-sw.js').catch(()=>{}))}
})();
</script>
