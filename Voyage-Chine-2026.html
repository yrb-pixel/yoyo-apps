{id:'b01',date:'2026-12-05',time:'16:55',end:'18:35',name:'Atterrissage à Beijing Capital (PEK)',tag:'Vol confirmé',type:'transport',cost:0,duration:'1 h 30 à 2 h',priority:'must',cn:'首都国际机场 2号航站楼',photo:im.beijing,desc:'AF382, arrivée au Terminal 2. Immigration, récupération des bagages, contrôle douanier et connexion data.',details:['Avant l’arrivée : compléter gratuitement la carte d’arrivée NIA via le site officiel, si applicable.','À l’immigration : présenter le passeport utilisé pour entrer, et conserver adresse de l’hôtel et billet de sortie accessibles hors ligne.','Après la douane : activer la data, vérifier Alipay et ouvrir DiDi/AMap.'],route:'Déplacement à l’intérieur du terminal. Suivre Arrival / Immigration / Baggage Claim. Ne pas confondre Beijing Capital (PEK) et Beijing Daxing (PKX).',app:'NIA 12367 · Alipay · AMap',tip:'La durée réelle dépend des files d’immigration. Ne planifier aucune attraction à heure fixe ce soir.',url:'https://s.nia.gov.cn/ArrivalCardFillingPC/',reserve:'Document d’entrée',budget:'Aucun billet touristique.'},
{id:'b02',date:'2026-12-05',time:'18:35',end:'19:50',name:'Aéroport → hôtel à Wangfujing',tag:'Transport à choisir',type:'transport',cost:140,duration:'50 à 90 min',priority:'must',cn:'王府井 / 东城区',photo:im.beijing,desc:'Transfert recommandé en DiDi depuis l’aéroport, surtout avec les valises après le long vol.',details:['Option facile : suivre les panneaux officiels vers la zone VTC / taxis, commander une DiDi dans l’application ou depuis Alipay, comparer plaque et modèle.','Alternative économique : Airport Express PEK → Dongzhimen (25 CNY/personne), puis métro ou DiDi vers l’hôtel; avec valises et après le vol, moins confortable.','Sauvegarder l’adresse complète de l’hôtel en chinois et une capture d’écran de la réservation.'],route:'PEK T2 → zone de prise en charge DiDi → hôtel (Wangfujing/Dongcheng). Adresse précise à renseigner une fois l’hôtel choisi. Tarif de voiture très variable : budget de travail ~100–180 CNY.',app:'DiDi ou Alipay · AMap',tip:'Utiliser les files officielles. Ne pas accepter les propositions de chauffeurs non sollicités.',url:'https://www.didiglobal.com/',reserve:'Hôtel à réserver',budget:'~100–180 CNY pour le véhicule (estimation).'},
{id:'b03',date:'2026-12-05',time:'20:15',end:'21:20',name:'Premier dîner & Wangfujing',tag:'Facultatif',type:'shopping',cost:100,duration:'45 à 75 min',priority:'optional',cn:'王府井步行街',photo:im.beijing,desc:'Petite balade dans la rue commerçante illuminée, uniquement si l’énergie le permet.',details:['Prendre un dîner simple à proximité de l’hôtel plutôt que traverser la ville.','Voir le secteur Beijing apm et les enseignes de Wangfujing; certaines boutiques peuvent fermer en cours de soirée.','Pour trouver un repas halal : rechercher 清真 (qīngzhēn) sur AMap ou Dianping; confirmer ingrédients et préparation sur place.'],route:'À pied si hôtel à Wangfujing, sinon DiDi court trajet. Ne pas imposer un détour si vous êtes fatigués.',app:'AMap · Dianping · Alipay',tip:'Plan B : douche, repos, dîner près de l’hôtel et coucher tôt.',url:'https://www.amap.com/search?query=王府井',reserve:'Aucune réservation',budget:'~60–150 CNY/personne selon le restaurant.'},
{id:'b04',date:'2026-12-06',time:'07:45',end:'08:25',name:'Hôtel → Place Tian’anmen',tag:'Départ anticipé',type:'transport',cost:25,duration:'25 à 45 min',priority:'must',cn:'天安门广场',photo:im.forbidden,desc:'Accès à la zone sécurisée avant la visite du centre impérial.',details:['Prendre le petit-déjeuner tôt et partir avec les passeports originaux.','Selon l’emplacement de l’hôtel : DiDi vers un point de dépose autorisé, puis marche jusqu’au contrôle; ou métro ligne 1 via une station à proximité.','Les contrôles peuvent imposer des détours : suivre les consignes locales et l’accès associé au créneau réservé.'],route:'Wangfujing → Tian’anmen East / entrée autorisée. Métro ligne 1 ou DiDi + marche. Prévoir du temps pour la sécurité.',app:'AMap · Alipay Metro QR',tip:'Les temps sont des marges, pas une promesse d’accès immédiat.',url:'https://english.beijing.gov.cn/travellinginbeijing/attractions/202603/t20260325_4566110.html',reserve:'Accès Tian’anmen',budget:'Métro ~3 CNY/personne ou DiDi selon hôtel.'},
{id:'b05',date:'2026-12-06',time:'08:25',end:'09:15',name:'Place Tian’anmen',tag:'Réservation / sécurité',type:'culture',cost:0,duration:'45 à 60 min',priority:'must',cn:'天安门广场',photo:im.forbidden,desc:'Le cœur monumental de Pékin, avec vue sur la Porte Tian’anmen et les grands bâtiments officiels.',details:['Observer la porte Tian’anmen, l’axe historique nord-sud, le Monument aux Héros du Peuple et le Mausolée de Mao vu de l’extérieur.','Ne pas compter sur une simple entrée spontanée : consulter les règles de réservation dans le mini-programme WeChat « 天安门广场预约参观 ».','L’accès est gratuit mais nominatif; les visiteurs étrangers peuvent devoir renseigner leur numéro de passeport.'],route:'Depuis la place, rejoindre à pied l’axe nord vers l’entrée sud de la Cité interdite. Prévoir 15 à 25 min de marche et contrôle.',app:'WeChat (mini-programme) · AMap',tip:'Le système web peut refuser les numéros étrangers : prévoir le mini-programme WeChat ou une réservation autorisée via un autre site compatible.',url:'https://english.beijing.gov.cn/12345hotline/faqs/all/202506/t20250619_4117006.html',reserve:'Réservation gratuite à effectuer',budget:'Gratuit'},
{id:'b06',date:'2026-12-06',time:'09:30',end:'13:30',name:'Cité interdite · Palais impérial',tag:'À réserver en priorité',type:'culture',cost:50,duration:'3 h 30 à 4 h',priority:'must',cn:'故宫博物院 / 午门',photo:im.forbidden,desc:'La visite centrale de Pékin : palais, cours impériales, halls cérémoniels et jardins Ming/Qing.',details:['Entrée par la Porte du Midi (午门, Meridian Gate) au sud, visite obligatoirement du sud au nord.','Parcours essentiel : Porte de l’Harmonie suprême → Salle de l’Harmonie suprême → Salle de l’Harmonie centrale → Salle de l’Harmonie préservée → palais intérieurs → Jardin impérial.','Option intéressante : Galerie des Trésors (+10 CNY) si ouverte et si vous voulez ajouter du temps; la Galerie des Horloges est aussi séparément payante.','Sortie par la Porte de la Prouesse divine (神武门) au nord, idéalement pour rejoindre Jingshan.'],route:'Depuis Tian’anmen, avancer vers le nord par l’axe du palais, contrôle puis porte du Midi. Sortie au nord; ne pas prévoir d’aller-retour par l’entrée.',app:'Site officiel Palace Museum · AMap',tip:'Fermé le lundi. En décembre : 08h30–16h30, dernière entrée 15h30. Billet adulte 40 CNY (+10 CNY Galerie des Trésors, option). Billetterie 7 jours avant à 20h heure de Pékin, soit le 29 novembre vers 13h à Paris pour le 6 décembre.',url:'https://intl.dpm.org.cn/visit',reserve:'29 novembre · vérifier l’ouverture des ventes',budget:'40 CNY + éventuels suppléments.'},
{id:'b07',date:'2026-12-06',time:'13:30',end:'14:20',name:'Pause déjeuner & trajet vers Jingshan',tag:'Pause essentielle',type:'food',cost:80,duration:'45 à 60 min',priority:'must',cn:'景山公园 南门',photo:im.forbidden,desc:'Petite pause après la marche dans l’immense palais et passage vers le parc Jingshan.',details:['Les possibilités de restauration à proximité de la sortie nord peuvent être limitées ou bondées : garder un snack et de l’eau.','Si vous souhaitez un vrai restaurant, prévoir une pause un peu plus longue et rogner sur le shopping du soir.'],route:'Sortie nord de la Cité interdite → traversée encadrée de la rue Jing Shan Qian → porte sud de Jingshan, environ 10–15 minutes à pied hors attente.',app:'AMap · Alipay',tip:'Le déjeuner se fera idéalement dans un endroit que vous aurez repéré la veille; chercher 清真 pour une option halal.',url:'https://www.amap.com/search?query=景山公园',reserve:'Libre',budget:'~50–100 CNY/personne'},
{id:'b08',date:'2026-12-06',time:'14:20',end:'15:25',name:'Parc Jingshan · vue sur le palais',tag:'Point photo',type:'nature',cost:2,duration:'50 à 70 min',priority:'must',cn:'景山公园 / 万春亭',photo:im.forbidden,desc:'Une montée courte jusqu’au pavillon Wanchun révèle toute la symétrie des toits dorés de la Cité interdite.',details:['Entrer par le sud puis monter vers le Pavillon Wanchun. Compter 10 à 20 minutes d’escaliers selon le rythme.','Profiter du panorama à 360°, repérer la Cité interdite au sud et les axes historiques de Pékin.','Possible arrêt café ou pause photo si météo claire.'],route:'Depuis la sortie nord de la Cité interdite : à pied vers l’entrée sud du parc. Retour de Jingshan → Wangfujing en DiDi (~15–30 min selon trafic) ou à pied si motivés.',app:'AMap',tip:'À faire avant la fin de l’après-midi car la lumière baisse vite début décembre. Deux pages officielles de Pékin divergent sur l’achat sur place pour étrangers : l’une l’autorise, une autre demande un appel de réservation au +86 10 6605 5431. Vérifier avant départ.',url:'https://www.amap.com/search?query=景山公园',reserve:'Billet sur place en principe',budget:'~2 CNY/personne estimatif'},
{id:'b09',date:'2026-12-06',time:'16:15',end:'19:30',name:'Wangfujing · shopping & dîner',tag:'À doser',type:'shopping',cost:150,duration:'2 à 3 h',priority:'optional',cn:'王府井大街 / 北京apm / 王府中環',photo:im.beijing,desc:'Temps libre dans le centre commerçant de Pékin, entre enseignes classiques et centres commerciaux.',details:['Découvrir Beijing apm, WF Central et les enseignes de Wangfujing.','Faire une liste d’envies : vêtements, cosmétique, marques chinoises, souvenirs; l’offre varie selon les magasins.','Pour un dîner typiquement pékinois : Dong Lai Shun (东来顺饭庄, succursale Beijing APM), 5e étage, salles 542–547, Beijing APM, 138 Wangfujing Dajie : fondue traditionnelle halal d’agneau. Adresse vérifiée par le gouvernement municipal de Pékin.','Vérifier l’heure de fermeture de la succursale du jour et la réservation éventuelle; en cas d’attente, chercher 清真 dans AMap.'],route:'Jingshan → Wangfujing : DiDi conseillé 15–30 min selon circulation ou marche 25–40 min.',app:'AMap · Dianping · Alipay',tip:'Garder cette séquence flexible si les visites historiques prennent davantage de temps.',url:'https://www.amap.com/search?query=王府井',reserve:'Libre',budget:'Achats à part; repas ~60–150 CNY/personne.'},
{id:'b10',date:'2026-12-07',time:'07:30',end:'09:50',name:'Départ pour la Muraille · Mutianyu',tag:'Chauffeur recommandé',type:'transport',cost:450,duration:'1 h 30 à 2 h 30',priority:'must',cn:'慕田峪长城景区',photo:im.wall,desc:'Quitter la ville tôt pour atteindre Mutianyu avant la foule et profiter d’un maximum de lumière.',details:['Option recommandée : chauffeur privé avec aller-retour et attente sur place, prix à demander pour les deux passagers, parking/attente inclus.','Alternative économique : transport touristique direct réservé sur plateforme; horaires plus rigides mais moins cher.','Option transports publics (plus lente) : bus 916 Express depuis Dongzhimen → Huairoubeidajie → correspondance locale H23/H3/H71 vers Mutianyu, selon horaires du jour.'],route:'Hôtel Wangfujing → Mutianyu Scenic Area Visitor Center, district de Huairou (environ 70–80 km). Estimation voiture : 1 h 30–2 h 30. Vérifier la prise en charge dans le bon terminal et la zone précise.',app:'DiDi / prestataire privé · AMap · Trip.com',tip:'Éviter de commander un aller simple sans solution garantie pour revenir de la montagne. Chauffeur A/R ou bus officiel plus fiable.',url:'https://english.beijing.gov.cn/travellinginbeijing/attractions/202603/t20260325_4566115.html',reserve:'Transport à choisir',budget:'Chauffeur A/R ~450–800 CNY par véhicule comme enveloppe indicative, à deviser.'},
{id:'b11',date:'2026-12-07',time:'09:50',end:'10:30',name:'Billets, navette & montée à Mutianyu',tag:'Deux réseaux de remontées',type:'transport',cost:200,duration:'30 à 50 min',priority:'must',cn:'慕田峪长城 / 缆车',photo:im.wall,desc:'Entrer dans le site, rejoindre le point de départ des remontées et monter au niveau des remparts.',details:['Sur place : contrôle/achat de l’entrée, navette interne si nécessaire, puis trajet vers l’opérateur de remontée sélectionné.','La télécabine fermée (cable car) arrive près de la tour 14. Le télésiège arrive vers la tour 6. Ce ne sont pas exactement les mêmes installations ni billets.','Option confort : télécabine aller-retour depuis la tour 14. Option aventure : télécabine montée + marche vers tour 6 + luge descente si ouverte.'],route:'Visitor Center → navette locale → station de télécabine. Suivre les panneaux « Cable Car » (pour tour 14) ou « Chairlift / Toboggan » (zone tour 6).',app:'Site officiel Mutianyu · Alipay',tip:'Le site touristique indique 45 CNY d’entrée adulte; remontées/navettes facturées en plus. Vérifier tarifs saisonniers et activité des remontées le jour J.',url:'https://en.mutianyugreatwall.com/',reserve:'Billets / remontées à confirmer',budget:'Entrée 45 CNY + navette ~15 CNY + remontée ~140–200 CNY (enveloppes).'},
{id:'b12',date:'2026-12-07',time:'10:30',end:'13:20',name:'Marcher SUR la Grande Muraille',tag:'Expérience phare',type:'nature',cost:0,duration:'2 h 30 à 3 h',priority:'must',cn:'慕田峪长城 14号敌楼',photo:im.wall,desc:'Marche sur les remparts en pierre entre tours de guet. Pas d’escalade verticale : des allées, marches et escaliers sur les crêtes.',details:['Option confort (préférée par défaut) : tour 14 → tours 15 à 18 selon énergie → retour tour 14 → télécabine fermée.','Option aventure : tour 14 → marche en direction de la tour 6 (plus longue et avec escaliers raides) → descente en luge si ouverte.','S’arrêter fréquemment pour les paysages et les photos; les marches sont irrégulières et certaines pentes sont très fortes.','Ne pas poursuivre trop loin si verglas, vent violent ou fatigue. Avoir de l’eau, une couche chaude et des chaussures antidérapantes.'],route:'Circuit piéton sur les remparts selon l’option choisie. Descente par l’opérateur correspondant à la sortie retenue. Ne pas compter sur un accès instantané d’une station à l’autre.',app:'AMap · appareil photo · Site Mutianyu',tip:'La luge dépend de la météo et des opérations du jour. En cas de gel, rester sur le parcours confort avec télécabine A/R.',url:'https://en.mutianyugreatwall.com/',reserve:'Choisir le parcours dans l’app',budget:'Marche incluse dans l’entrée du site.'},
{id:'b13',date:'2026-12-07',time:'13:20',end:'14:15',name:'Descente, pause & déjeuner',tag:'Prévoir chaud',type:'food',cost:85,duration:'45 à 60 min',priority:'must',cn:'慕田峪长城 游客中心',photo:im.wall,desc:'Fin de la visite, descente et déjeuner simple avant de repartir.',details:['Si parcours confort : retour à la tour 14 et télécabine A/R.','Si parcours aventure : descente en luge uniquement si opérationnelle, puis retour vers la zone visiteurs.','Possibilités de restauration touristique en bas : offre et options halal à vérifier; apporter une collation comme solution de secours.'],route:'Tour choisie → remontée/descente → navette vers Visitor Center → rendez-vous au point exact convenu avec le chauffeur.',app:'AMap · messagerie du chauffeur',tip:'Ne pas supposer que la luge fonctionne en décembre; organiser le retour sans en dépendre.',url:'https://en.mutianyugreatwall.com/',reserve:'Aucune, hors remontées',budget:'~50–120 CNY/personne de repas.'},
{id:'b14',date:'2026-12-07',time:'14:15',end:'16:45',name:'Retour vers Pékin & récupération',tag:'Marge trafic',type:'transport',cost:0,duration:'2 à 2 h 30',priority:'must',cn:'北京市 东城区',photo:im.beijing,desc:'Retour à l’hôtel, douche et repos après la marche et le froid.',details:['Confirmer l’heure et le lieu de rendez-vous avec le chauffeur avant de monter sur la Muraille.','Si retour tardif, raccourcir Sanlitun, sans chercher à récupérer le retard.'],route:'Mutianyu → Wangfujing/Dongcheng en véhicule privé ou bus réservé. Le montant est normalement compris dans le trajet A/R déjà budgété.',app:'DiDi · AMap',tip:'Ne pas prévoir de rendez-vous non remboursable à 17h : circulation incertaine.',url:'https://www.amap.com/',reserve:'Inclus dans la voiture A/R',budget:'Inclus dans transport aller-retour.'},

let data;try{const x=JSON.parse(localStorage.getItem(STORAGE));data={...BASE,...(x&&typeof x==='object'?x:{})};}catch{data={...BASE};}delete data.votes;delete data.person;
function save(){data.lastSaved=new Date().toISOString();try{localStorage.setItem(STORAGE,JSON.stringify(data));}catch(e){showToast('Stockage local indisponible : exportez les données.')} }
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function safeURL(u){return /^https:\/\//i.test(String(u||''))?esc(u):'#'}
function pic(url){return `style="--photo:url('${esc(url)}')"`}
function curActivities(){return [...acts,...data.custom].sort((a,b)=>a.date.localeCompare(b.date)||a.time.localeCompare(b.time))}
function displayDay(d){return `${d.dow} ${Number(d.date.slice(-2))} décembre`}
function tagFor(a){return `<span class="label ${a.priority==='must'?'orange':''}">${a.priority==='must'?'Incontournable':a.priority==='optional'?'Facultatif':'À organiser'}</span>`}
function showToast(s){let el=document.getElementById('toast');el.textContent=s;el.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>el.classList.remove('show'),2900)}

const WEATHER={Beijing:{lat:39.9042,lon:116.4074,low:-6,high:4,tip:'Froid sec, gants, bonnet, sous-couches et coupe-vent.'},Shanghai:{lat:31.2304,lon:121.4737,low:3,high:11,tip:'Veste chaude, couches et protection contre l’humidité.'},Shenzhen:{lat:22.5431,lon:114.0579,low:14,high:21,tip:'Veste légère pour le soir et vêtements modulables.'},'Hong Kong':{lat:22.3193,lon:114.1694,low:15,high:21,tip:'Veste légère, vent possible sur le port.'}};
let forecastStore={},forecastLoading=false,forecastCheck='',forecastError='';
function solarTime(date,lat,lon,rise){const d=new Date(date+'T00:00:00Z'),y=d.getUTCFullYear(),n=Math.round((Date.UTC(y,d.getUTCMonth(),d.getUTCDate())-Date.UTC(y,0,0))/86400000),rad=Math.PI/180,norm=x=>(x%360+360)%360,lng=lon/15,t=n+((rise?6:18)-lng)/24,m=.9856*t-3.289,L=norm(m+1.916*Math.sin(m*rad)+.02*Math.sin(2*m*rad)+282.634);let RA=norm(Math.atan(.91764*Math.tan(L*rad))/rad);RA+=(Math.floor(L/90)-Math.floor(RA/90))*90;RA/=15;const sd=.39782*Math.sin(L*rad),cd=Math.cos(Math.asin(sd)),ch=(Math.cos(90.833*rad)-sd*Math.sin(lat*rad))/(cd*Math.cos(lat*rad));if(Math.abs(ch)>1)return '—';const h=(rise?360-Math.acos(ch)/rad:Math.acos(ch)/rad)/15,ut=h+RA-.06571*t-6.622-lng;const mm=Math.round((((ut+8)%24+24)%24)*60)%1440;return String(Math.floor(mm/60)).padStart(2,'0')+':'+String(mm%60).padStart(2,'0')}
function sky(code){if(code==null)return '🌡️';if(code<=1)return '☀️';if(code===2)return '⛅';if(code===3)return '☁️';if([45,48].includes(code))return '🌫️';if([71,73,75,77,85,86].includes(code))return '🌨️';if(code<=67||[80,81,82].includes(code))return '🌧️';return '⛈️'}
function weatherDay(date,city){const c=WEATHER[city],f=forecastStore[city]?.[date];return {pred:!!f,low:f?Math.round(f.low):c.low,high:f?Math.round(f.high):c.high,rain:f?.rain,wind:f?.wind,icon:sky(f?.code),rise:f?.rise||solarTime(date,c.lat,c.lon,true),set:f?.set||solarTime(date,c.lat,c.lon,false)}}
function weatherCompact(date,city){let w=weatherDay(date,city),name=cities.find(c=>c.en===city)?.name;return `<div class="weather-compact"><strong>${name}</strong><span>${w.icon} ${w.low} à ${w.high} °C</span><small>🌅 ${w.rise} · 🌇 ${w.set}</small></div>`}
function weatherPanel(day){let w=weatherDay(day.date,day.city);return `<div class="forecast-strip"><div class="forecast-main"><span class="forecast-symbol">${w.icon}</span><div><small>${w.pred?'PRÉVISION ACTUALISÉE':'CLIMAT HABITUEL EN DÉCEMBRE'}</small><strong>${w.low} à ${w.high} °C</strong><span>${w.pred?`Précipitations ${w.rain??'—'} % · Vent max ${w.wind??'—'} km/h`:'Moyennes saisonnières, pas une prévision'}</span></div></div><div class="forecast-sun"><div>🌅 Lever <b>${w.rise}</b></div><div>🌇 Coucher <b>${w.set}</b></div></div><p class="footnote">${WEATHER[day.city].tip} · Heures locales UTC+8. Horaires solaires calculés (précision de quelques minutes), ou provenant de la prévision.</p></div>`}
async function loadForecasts(force=false){const daysAway=(Date.parse('2026-12-05T00:00:00+08:00')-Date.now())/86400000;if(daysAway>15.5&&!force){forecastCheck='Les prévisions commenceront à couvrir le voyage vers fin novembre';return}if(forecastLoading)return;forecastLoading=true;forecastError='';await Promise.all(Object.entries(WEATHER).map(async([city,c])=>{try{const q=new URLSearchParams({latitude:c.lat,longitude:c.lon,timezone:'Asia/Shanghai',forecast_days:'16',daily:'temperature_2m_max,temperature_2m_min,precipitation_probability_max,weather_code,sunrise,sunset,wind_speed_10m_max'});const res=await fetch('https://api.open-meteo.com/v1/forecast?'+q.toString(),{cache:'no-store'});if(!res.ok)throw Error(res.status);const j=await res.json(),d=j.daily||{};forecastStore[city]={};(d.time||[]).forEach((date,i)=>forecastStore[city][date]={high:d.temperature_2m_max?.[i],low:d.temperature_2m_min?.[i],rain:d.precipitation_probability_max?.[i],wind:d.wind_speed_10m_max?.[i],code:d.weather_code?.[i],rise:d.sunrise?.[i]?.slice(11,16),set:d.sunset?.[i]?.slice(11,16)})}catch(e){forecastError='Certaines prévisions sont indisponibles'}}));forecastLoading=false;forecastCheck=new Date().toLocaleString('fr-FR');if(['weather','program','overview'].includes(S.pagemode))render()}

function mapPage(){const city=S.mapCity||'Beijing',list=mapLocations[city],p=list.find(x=>x.id===S.mapPoint)||list[0],name=cities.find(c=>c.en===city)?.name;return `<div class="overline">Repères & transports</div><h1 class="page-title">Cartes & lieux</h1><p class="subtitle">Sélectionnez une ville, puis un lieu. Pour les trajets réels, utilisez AMap et le nom chinois.</p><div class="map-city-tabs">${cities.map(c=>`<button data-map-city="${c.en}" class="${city===c.en?'active':''}">${c.name}</button>`).join('')}</div><div class="section two-col" style="grid-template-columns:1.25fr 1fr"><div class="panel"><div class="horizontal" style="justify-content:space-between;margin-bottom:15px"><div><div class="overline">${name}</div><b>${esc(p.name)}</b><div class="compact">${esc(p.cn)}</div></div>${p.act?`<button class="button line sm" data-detail="${p.act}">Fiche pratique ↗</button>`:'<span class="label orange">À planifier</span>'}</div><iframe title="Carte de ${name}" src="${osmEmbed(p)}" loading="lazy" referrerpolicy="no-referrer" style="width:100%;height:425px;border:1px solid #dfe8e4;border-radius:14px"></iframe><p class="compact">OpenStreetMap nécessite internet et peut être indisponible en Chine continentale. AMap est recommandé pour la navigation sur place.</p><button class="button soft sm" data-map="${esc(p.cn||p.name)}">Ouvrir dans AMap ↗</button></div><div class="panel"><div class="overline">${list.length} lieux · ${name}</div><h3 class="panel-title">Choisir un lieu</h3>${city!=='Beijing'?'<p class="compact">Repères indicatifs pour préparer les visites. Activités non encore confirmées.</p>':''}<div style="display:flex;flex-direction:column;gap:7px;max-height:530px;overflow:auto">${list.map(q=>`<button data-map-focus="${q.id}" style="text-align:left;padding:12px;background:${p.id===q.id?'#e8f6ef':'#fafbf9'};border:1px solid #e2ece4;border-radius:12px"><b>📍 ${esc(q.name)}</b><small style="display:block;color:#85948e;margin-top:4px">${esc(q.desc)}</small></button>`).join('')}</div></div></div>`}
function weatherPage(){return `<div class="overline">Températures & durée du jour</div><h1 class="page-title">Météo & soleil</h1><p class="subtitle">Climat de décembre et horaires solaires pour les 17 journées. Les prévisions réelles, disponibles jusqu'à 16 jours à l'avance, remplaceront les moyennes saisonnières.</p><div class="city-row">${cities.map(c=>`<div class="weather-city-card"><b>${c.name}</b><strong>${WEATHER[c.en].low} à ${WEATHER[c.en].high} °C</strong><small>Moyennes habituelles</small></div>`).join('')}</div><section class="section"><div class="section-head"><h2>Jour par jour</h2><button class="button line sm" data-weather-refresh>↻ Actualiser</button></div><div class="weather-table">${days.map(d=>{const w=weatherDay(d.date,d.city);return `<button class="weather-date-row" data-date="${d.date}"><span><b>${d.dow} ${d.date.slice(-2)}/12</b><small>${cities.find(c=>c.en===d.city)?.name}</small></span><strong>${w.icon} ${w.low} / ${w.high} °C</strong><span>🌅 ${w.rise}<br>🌇 ${w.set}</span><small>${w.pred?'Prévision':'Saison'}</small></button>`}).join('')}</div><p class="footnote">« Saison » signifie températures moyennes de décembre, pas la météo du jour. Lever et coucher calculés astronomiquement, à quelques minutes près. Toutes les heures sont locales UTC+8. ${forecastError?esc(forecastError):''}</p></section><div class="section panels"><div class="panel"><h3 class="panel-title">Actualisation</h3><p>La météo Open-Meteo s'affichera automatiquement lorsqu'elle couvre les dates du voyage.</p><p class="compact">${forecastCheck||'Prévisions pas encore disponibles pour les dates choisies'}</p><a class="link" href="https://open-meteo.com/en/docs" target="_blank" rel="noopener">Source : Open-Meteo ↗</a></div><div class="panel"><h3 class="panel-title">Tenues à prévoir</h3>${cities.map(c=>`<p><b>${c.name} :</b> ${WEATHER[c.en].tip}</p>`).join('')}</div></div>`}

function prepare(){let done=todos.filter(x=>data.checked[x.id]).length;let groups=[...new Set(todos.map(t=>t.category))];return `<div class="overline">Avant de décoller</div><h1 class="page-title">Préparatifs & applications</h1><p class="subtitle">Une checklist concrète, pas une liste de conseils génériques. Chaque coche est sauvegardée localement.</p><div class="section panels"><div class="panel"><h3 class="panel-title">Préparation du voyage</h3><p class="muted">${done} actions terminées sur ${todos.length}</p><div class="progress"><div style="width:${Math.round(done/todos.length*100)}%"></div></div><p class="footnote">La réservation et la préparation restent deux choses différentes : une coche n’équivaut pas à une réservation confirmée.</p></div><div class="panel"><h3 class="panel-title">Hôtel de Pékin</h3><label class="field-label">Nom de l’hôtel</label><input class="field" id="hotel" placeholder="Ex. hôtel proche Wangfujing" value="${esc(data.hotel)}"><label class="field-label">Adresse en chinois, à montrer au chauffeur</label><input class="field" id="hotelChinese" placeholder="Adresse complète en chinois" value="${esc(data.hotelChinese)}"><label class="field-label">Adresse / consignes de check-in</label><input class="field" id="hotelAddress" placeholder="Adresse complète, confirmation, etc." value="${esc(data.hotelAddress)}"><p class="footnote">Ces informations ne quittent pas cet appareil tant que vous ne les exportez pas.</p></div></div>
<section class="section"><div class="section-head"><h2>Checklist de préparation</h2><span class="day-tag">${Math.round(done/todos.length*100)} % terminé</span></div><div class="two-col">${groups.map(g=>`<div class="panel"><div class="overline">${g}</div>${todos.filter(x=>x.category===g).map(t=>`<label class="check ${data.checked[t.id]?'done':''}"><input type="checkbox" data-check="${t.id}" ${data.checked[t.id]?'checked':''}><div><b>${esc(t.name)}</b><small>${esc(t.desc)}</small></div></label>`).join('')}</div>`).join('')}</div></section>
<section class="section"><div class="section-head"><div><h2>La boîte à outils chinoise</h2><p>À installer et configurer en France, idéalement avant le départ.</p></div></div><div class="three-col">${appList.map(a=>`<div class="app-item"><div class="app-icon">${a.icon}</div><div><b>${esc(a.name)} <small class="muted">${esc(a.cn)}</small></b><br><span class="pill">${esc(a.importance)}</span><p>${esc(a.desc)}</p><a href="${safeURL(a.link)}" target="_blank" rel="noopener" class="link">Site officiel / service ↗</a></div></div>`).join('')}</div></section><section class="section"><div class="panel"><div class="overline">Rappels utiles</div><div class="flash amber"><span class="flash-icon">⚠️</span><div><b>Connectivité en Chine</b><br>Les services internationaux (Google, WhatsApp, etc.) peuvent être inaccessibles sur certaines connexions locales. Ne pas attendre l’arrivée pour tester la solution data.</div></div><div class="flash"><span class="flash-icon">🍲</span><div><b>Repas halal</b><br>Rechercher « 清真 » dans AMap / Dianping, puis vérifier sur place. Ce mot ne garantit pas à lui seul tous les critères recherchés.</div></div><div class="flash blue"><span class="flash-icon">🧾</span><div><b>Passeports</b><br>Les billets de sites, trains et formalités peuvent être liés au numéro de passeport. Garder les originaux disponibles pour les contrôles.</div></div></div></section>`}
function budget(){let cats=[['Vols internationaux','Confirmés','Vols CDG → PEK et HKG → CDG, prix non renseignés.'],['Hôtels','À réserver','Pékin 4 nuits; Shanghai 8; Shenzhen 2; Hong Kong 2.'],['Transports en Chine','À réserver','TGV Pékin → Shanghai, vol Shanghai → Shenzhen et train Shenzhen → Hong Kong.'],['Activités Pékin','Estimations','Entrées, télécabine, chauffeur Mutianyu.'],['Repas & shopping','À définir','Budgets par jour non fixés.']];let bookings=[['Cité interdite','6 décembre · ouverture billetterie prévue 29 novembre','b06'],['Tian’anmen','6 décembre · réserver par canal adapté','b05'],['Mutianyu / transport','7 décembre · A/R et météo','b10'],['Palais d’Été','8 décembre · entrée combinée à confirmer','b17'],['Temple du Ciel','9 décembre · billet combiné','b23'],['TGV Pékin–Shanghai','9 décembre · train non choisi','b25']];return `<div class="overline">Finance & logistique</div><h1 class="page-title">Budget & réservations</h1><p class="subtitle">Une base de pilotage sans inventer de prix d’hôtels, de vols ou d’horaires non réservés.</p><div class="section two-col"><div class="panel"><h3 class="panel-title">Vue du budget</h3>${cats.map((x,i)=>`<div class="budget-row"><div><b>${x[0]}</b><div class="compact">${x[2]}</div></div><span class="pill ${i===0?'':'todo'}" style="height:fit-content;white-space:nowrap">${x[1]}</span></div>`).join('')}<p class="footnote">Toutes les sommes en CNY présentées dans les fiches sont des tarifs connus ou des estimations clairement signalées. Aucune conversion euro automatique, car les cours changent.</p></div><div class="panel"><h3 class="panel-title">Dates structurantes</h3><div class="check"><span>✈️</span><div><b>4 déc. • Paris → Pékin</b><small>Air France AF382 · 22h40 CDG T2E → 16h55 PEK T2 le 5 déc.</small></div></div><div class="check"><span>🚄</span><div><b>9 déc. • Pékin → Shanghai</b><small>Train G à réserver, depuis Beijing South.</small></div></div><div class="check"><span>✈️</span><div><b>17 déc. • Shanghai → Shenzhen</b><small>Avion suggéré, vol et horaire non choisis.</small></div></div><div class="check"><span>🚄</span><div><b>19 déc. • Shenzhen → Hong Kong</b><small>Train à grande vitesse suggéré, frontières à franchir.</small></div></div><div class="check"><span>✈️</span><div><b>21 déc. • Hong Kong → Paris</b><small>Air France AF185 · 22h45 HKG → 05h50 CDG le 22 déc.</small></div></div></div></div><section class="section"><div class="section-head"><h2>Suivi des réservations de Pékin</h2></div><div class="two-col">${bookings.map(([n,sub,id])=>`<div class="panel"><div class="horizontal" style="justify-content:space-between"><b>${n}</b><span class="pill ${data.reservations[id]?'':'todo'}">${data.reservations[id]?'Réservé':'À faire'}</span></div><p class="compact">${sub}</p><div class="horizontal" style="justify-content:space-between;margin-top:13px"><button class="button line sm" data-detail="${id}">Voir détails ↗</button><button class="button ${data.reservations[id]?'soft':'line'} sm" data-reservation="${id}">${data.reservations[id]?'✓ Marqué réservé':'Marquer réservé'}</button></div></div>`).join('')}</div><p class="footnote">« Marquer réservé » est une case de suivi manuelle, sans achat réel.</p></section><section class="section"><div class="panel"><div class="overline">Sites fiables</div><h3 class="panel-title">Sources officielles et utiles</h3><div class="two-col">${sources.map(x=>`<a class="source-link" href="${safeURL(x.u)}" rel="noopener" target="_blank">↗ ${esc(x.t)}</a>`).join('')}</div></div></section>`}
function share(){return `<div class="overline">Sauvegarde</div><h1 class="page-title">Partager & exporter</h1><p class="subtitle">Les notes, réservations et activités ajoutées sont enregistrées localement, sans synchronisation entre appareils.</p><div class="section panels"><div class="panel"><h3 class="panel-title">Exporter ou importer les données</h3><p>Sauvegarde JSON des notes, réservations, hôtels et activités personnalisées.</p><div class="horizontal" style="margin:16px 0;flex-wrap:wrap"><button class="button" data-export>↓ Exporter JSON</button><button class="button line" data-import>↑ Importer JSON</button></div><p class="footnote">L’import remplace les données locales. Exporter avant d’importer.</p></div><div class="panel"><h3 class="panel-title">Lien de l'application</h3><a class="link" href="https://yrb-pixel.github.io/yoyo-apps/Voyage-Chine-2026.html" target="_blank" rel="noopener">Ouvrir l’application ↗</a><p>Accessible sur téléphone et ordinateur. Une synchronisation en temps réel nécessiterait un stockage partagé.</p></div></div><div class="section two-col"><div class="panel"><h3 class="panel-title">Résumé</h3><button class="button soft" data-copy-summary>⧉ Copier le résumé</button></div><div class="panel"><h3 class="panel-title">Réinitialiser</h3><button class="button warn" data-reset>↺ Réinitialiser</button></div></div><p class="footnote">Éviter d’enregistrer des numéros de passeport ou des données bancaires.</p>`}
function detail(a){S.detailId=a.id;const html=`<div class="modal-head"><div><div class="overline">${esc(days.find(d=>d.date===a.date)?.dow||'')} ${a.date.slice(-2)} décembre · ${esc(a.time)}–${esc(a.end)}</div><h2>${esc(a.name)}</h2></div><button class="close" data-close aria-label="Fermer">×</button></div><div class="detail-cover" ${pic(a.photo||im.beijing)}>${esc(a.cn||'')}</div><p style="line-height:1.7;color:#526f69">${esc(a.desc)}</p><div class="act-row">${tagFor(a)}<span class="label">${esc(a.duration||'')}</span><span class="label">${esc(a.tag||'')}</span></div><div class="detail-block"><h3>✦ Ce que vous ferez sur place</h3><ul>${(a.details||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="detail-block"><h3>🚗 Trajet porte à porte</h3><p>${esc(a.route||'À compléter')}</p><div class="subcard"><b>📱 Application à ouvrir</b><p>${esc(a.app||'AMap / DiDi')}</p><p><b>Adresse à copier / montrer au chauffeur</b> <span class="break">${esc(a.cn||'À compléter')}</span></p><div class="horizontal" style="flex-wrap:wrap;margin-top:10px"><button class="button sm soft" data-copy="${esc(a.cn||'')}">Copier l’adresse chinoise</button><button class="button sm line" data-map="${esc(a.cn||a.name)}">Rechercher dans AMap ↗</button></div></div></div><div class="detail-block"><h3>🎟 Réservation & budget</h3><p><b>Statut :</b> ${esc(a.reserve||'À compléter')}</p><p><b>Budget :</b> ${esc(a.budget||'Non précisé')}</p>${a.url?`<a href="${safeURL(a.url)}" target="_blank" rel="noopener" class="link">Ouvrir la source / billetterie ↗</a>`:''}<div style="margin-top:13px"><button class="button ${data.reservations[a.id]?'soft':'line'} sm" data-reservation="${a.id}">${data.reservations[a.id]?'✓ Réservation marquée comme effectuée':'Marquer réservé (suivi uniquement)'}</button></div></div><div class="detail-block"><h3>💡 Le conseil important</h3><p>${esc(a.tip||'Prévoir une marge.')}</p></div>${String(a.id).startsWith('x')?`<div style="margin-top:16px"><button data-delete-custom="${a.id}" class="button warn sm">Supprimer cette activité personnalisée</button></div>`:''}`;openModal(html)}
function openModal(html){document.getElementById('modal').innerHTML=html;document.getElementById('modal-bg').classList.add('show');document.body.style.overflow='hidden'}
function closeModal(){document.getElementById('modal-bg').classList.remove('show');document.body.style.overflow='';S.detailId=null}
function addActivity(date){S.detailId=null;openModal(`<div class="modal-head"><div><div class="overline">Personnalisation</div><h2>Ajouter une idée à la journée</h2><p class="compact">${esc(date)}</p></div><button class="close" data-close>×</button></div><form id="add-form"><input type="hidden" name="date" value="${esc(date)}"><label class="field-label">Titre de l'activité *</label><input class="field" name="name" required maxlength="100" placeholder="Ex. Atelier de calligraphie"><div class="two-col"><div><label class="field-label">Début</label><input class="field" name="time" type="time" value="16:00" required></div><div><label class="field-label">Fin</label><input class="field" name="end" type="time" value="17:00" required></div></div><label class="field-label">Description</label><textarea class="field" name="desc" rows="3" placeholder="Ce qu'on veut faire"></textarea><label class="field-label">Adresse / lieu en chinois (si connu)</label><input class="field" name="cn" placeholder="Nom ou adresse"><label class="field-label">Comment s’y rendre</label><textarea class="field" name="route" rows="2" placeholder="Métro, DiDi, à pied…"></textarea><label class="field-label">Lien utile (https://)</label><input class="field" name="url" placeholder="https://"><div style="margin-top:17px"><button class="button full" type="submit">Ajouter au programme</button></div></form>`)}
function exportData(){const payload={app:'WANDER CHINA 2026',version:1,exportedAt:new Date().toISOString(),state:data};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='chine-2026-younes-zineb-sauvegarde.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);showToast('Sauvegarde JSON exportée.');}
function copyText(s){if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(s).then(()=>showToast('Texte copié !')).catch(()=>fallbackCopy(s))}else fallbackCopy(s)}
function fallbackCopy(s){const a=document.createElement('textarea');a.value=s;document.body.appendChild(a);a.select();try{document.execCommand('copy');showToast('Texte copié !')}catch(e){showToast('Copie non disponible : sélectionner le texte manuellement.')}a.remove()}
function summary(){return `CHINE 2026 · ITINÉRAIRE
05/12 Pékin (4 nuits) · 09/12 Shanghai (8) · 17/12 Shenzhen (2) · 19/12 Hong Kong (2)
Grande Muraille : ${data.selectedWall==='comfort'?'télécabine A/R':'marche + luge si possible'}
${curActivities().map(a=>a.date+' '+a.time+' '+a.name).join('\n')}`}
function mapSearch(q){window.open('https://www.amap.com/search?query='+encodeURIComponent(q),'_blank','noopener')}
function clickHandler(e){const b=e.target.closest('[data-nav],[data-date],[data-open-city],[data-map-city],[data-detail],[data-close],[data-wall],[data-check],[data-reservation],[data-open-add],[data-export],[data-import],[data-copy-summary],[data-reset],[data-copy],[data-map],[data-map-focus],[data-weather-refresh],[data-delete-custom]');if(!b)return;
if(b.dataset.nav){nav(b.dataset.nav);return}
if(b.dataset.date){S.selectedDate=b.dataset.date;nav('program');return}
if(b.dataset.openCity){const d=days.find(x=>x.city===b.dataset.openCity);if(d){S.selectedDate=d.date;nav('program')}return}
if(b.dataset.mapCity){S.mapCity=b.dataset.mapCity;S.mapPoint=mapLocations[S.mapCity][0].id;nav('map');return}
if(b.dataset.detail){const a=curActivities().find(x=>x.id===b.dataset.detail);if(a)detail(a);return}
if(b.hasAttribute('data-close')){closeModal();return}
if(b.dataset.wall){data.selectedWall=b.dataset.wall;save();render();return}
if(b.dataset.check){data.checked[b.dataset.check]=b.checked;save();render();return}
if(b.dataset.reservation){data.reservations[b.dataset.reservation]=!data.reservations[b.dataset.reservation];save();render();if(S.detailId){const a=curActivities().find(x=>x.id===S.detailId);if(a)detail(a)}return}
if(b.dataset.openAdd){addActivity(b.dataset.openAdd);return}
if(b.hasAttribute('data-export')){exportData();return}
if(b.hasAttribute('data-import')){document.getElementById('file-import').click();return}
if(b.hasAttribute('data-copy-summary')){copyText(summary());return}
if(b.hasAttribute('data-reset')){if(confirm('Effacer les notes et données locales ?')){data=structuredClone(BASE);save();render()}return}
if(b.dataset.copy!==undefined){copyText(b.dataset.copy);return}
if(b.dataset.map){mapSearch(b.dataset.map);return}
if(b.dataset.mapFocus){S.mapPoint=b.dataset.mapFocus;render();return}
if(b.hasAttribute('data-weather-refresh')){loadForecasts(true);showToast('Actualisation météo demandée');return}
if(b.dataset.deleteCustom){if(confirm('Supprimer cette activité ?')){data.custom=data.custom.filter(x=>x.id!==b.dataset.deleteCustom);save();closeModal();render()}return}
}
function changeHandler(e){let el=e.target;if(el.id==='day-note'){data.notes[el.dataset.note]=el.value;save();return}if(['hotel','hotelChinese','hotelAddress'].includes(el.id)){data[el.id]=el.value;save();return}}
function submitHandler(e){if(e.target.id!=='add-form')return;e.preventDefault();let f=new FormData(e.target);let name=String(f.get('name')||'').trim();if(!name)return;let u=String(f.get('url')||'').trim();if(u&&!/^https:\/\//i.test(u)){showToast('Le lien doit commencer par https://');return}let a={id:'x'+Date.now(),date:String(f.get('date')),name,time:String(f.get('time')),end:String(f.get('end')),desc:String(f.get('desc')||'Idée ajoutée par le couple'),cn:String(f.get('cn')||''),route:String(f.get('route')||'À déterminer dans AMap'),url:u,tag:'Idée personnalisée',type:'custom',cost:0,priority:'optional',photo:im.beijing,details:[String(f.get('desc')||'À préciser')],app:'AMap / DiDi',reserve:'À vérifier',budget:'À estimer',tip:'Activité ajoutée librement, vérifier horaires et transport avant de confirmer.'};data.custom.push(a);save();closeModal();render();showToast('Activité ajoutée !')}
document.addEventListener('click',clickHandler);document.addEventListener('input',changeHandler);document.addEventListener('submit',submitHandler);document.getElementById('modal-bg').addEventListener('click',e=>{if(e.target.id==='modal-bg')closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});document.getElementById('backup-top').addEventListener('click',exportData);
document.getElementById('file-import').addEventListener('change',e=>{let file=e.target.files?.[0];if(!file)return;let reader=new FileReader();reader.onload=()=>{try{let payload=JSON.parse(reader.result);if(payload.app!=='WANDER CHINA 2026'||!payload.state||!Array.isArray(payload.state.custom))throw Error('Format invalide');if(!confirm('Importer cette sauvegarde et remplacer les choix locaux actuels ?'))return;data={...BASE,...payload.state};delete data.person;delete data.votes;save();closeModal();render();showToast('Sauvegarde importée !')}catch(ex){alert('Impossible de lire la sauvegarde : '+ex.message)}};reader.readAsText(file);e.target.value=''});
render();
loadForecasts();
})();
</script>
</body>
</html>
